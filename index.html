/* ---------------- L5X import ---------------- */
const kids = (el, name) => el ? [...el.children].filter(c => c.tagName === name) : [];
const kid = (el, name) => kids(el, name)[0] || null;
const cdata = el => el ? el.textContent.replace(/^\s*\n/, '').replace(/\n\s*$/, '') : '';
function parseVal(s, type){
  s = String(s == null ? '0' : s).trim();
  if (type === 'REAL') return Math.fround(parseFloat(s) || 0);
  if (type === 'BOOL') return (s === '1' || lc(s) === 'true') ? 1 : 0;
  const m = /^(2|8|16)#(.+)$/.exec(s);
  if (m) return wrap(type, parseInt(m[2].replace(/_/g, ''), +m[1]));
  if (/^'.*'$/.test(s)) return 0;
  return wrap(type, parseFloat(s) || 0);
}
function readDec(el, type, cur){
  switch (el.tagName){
    case 'DataValue': return parseVal(el.getAttribute('Value'), type);
    case 'Array': case 'ArrayMember':
      if (!Array.isArray(cur)) return cur;
      for (const e of el.children){
        const idx = parseInt(String(e.getAttribute('Index') || '').replace(/[\[\]]/g, ''));
        if (!(idx >= 0 && idx < cur.length)) continue;
        if (e.hasAttribute('Value')) cur[idx] = parseVal(e.getAttribute('Value'), type);
        else if (e.firstElementChild) cur[idx] = readDec(e.firstElementChild, type, cur[idx]);
      }
      return cur;
    case 'Structure': case 'StructureMember': {
      if (!cur || typeof cur !== 'object') return cur;
      const ms = membersOf(type) || [];
      for (const e of el.children){
        const m = ms.find(x => lc(x.name) === lc(e.getAttribute('Name'))); if (!m) continue;
        if (e.tagName === 'DataValueMember') cur[m.name] = parseVal(e.getAttribute('Value'), m.type);
        else cur[m.name] = readDec(e, m.type, cur[m.name]);
      }
      return cur;
    }
  }
  return cur;
}
function parseTag(el){
  const dims = String(el.getAttribute('Dimensions') || '').trim();
  const t = {name:el.getAttribute('Name'), type:el.getAttribute('DataType') || 'DINT', dim:dims ? parseInt(dims) || 0 : 0,
    description:cdata(kid(el, 'Description'))};
  if (el.getAttribute('TagType') === 'Alias') t.alias = el.getAttribute('AliasFor');
  t.value = instantiate(t.type, t.dim);
  const data = kids(el, 'Data').find(d => d.getAttribute('Format') === 'Decorated');
  if (data && data.firstElementChild){ try { t.value = readDec(data.firstElementChild, t.type, t.value); } catch(e){} }
  return t;
}
function mergeTag(list, t, report){
  const i = list.findIndex(x => lc(x.name) === lc(t.name));
  if (i >= 0) list[i] = t; else list.push(t);
  report.tags++;
}
function importL5X(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('This file is not valid XML.');
  const root = doc.documentElement;
  if (root.tagName !== 'RSLogix5000Content') throw new Error('This is XML, but not an L5X export (no RSLogix5000Content root).');
  const target = root.getAttribute('TargetType') || 'Controller';
  const ctl = kid(root, 'Controller');
  if (!ctl) throw new Error('The file has no Controller section.');
  const report = {target, name:root.getAttribute('TargetName') || '', udts:0, tags:0, routines:[], skipped:[]};
  if (target === 'Controller') P = emptyProject(ctl.getAttribute('Name')), P.programs = [];
  if (root.getAttribute('SoftwareRevision')) P.rev = root.getAttribute('SoftwareRevision');
  if (target === 'Controller' || !P.name || P.name === 'MyProject') P.name = ctl.getAttribute('Name') || P.name;

  const changedTypes = [];
  for (const dt of kids(kid(ctl, 'DataTypes'), 'DataType')){
    if (dt.getAttribute('Class') && dt.getAttribute('Class') !== 'User') continue;
    const members = [];
    for (const m of kids(kid(dt, 'Members'), 'Member')){
      if (m.getAttribute('Hidden') === 'true') continue;
      let type = m.getAttribute('DataType'); if (type === 'BIT') type = 'BOOL';
      members.push({name:m.getAttribute('Name'), type, dim:parseInt(m.getAttribute('Dimension')) || 0, description:cdata(kid(m, 'Description'))});
    }
    const u = {name:dt.getAttribute('Name'), description:cdata(kid(dt, 'Description')), members};
    const i = P.udts.findIndex(x => lc(x.name) === lc(u.name));
    if (i >= 0) P.udts[i] = u; else P.udts.push(u);
    changedTypes.push(u.name); report.udts++;
  }
  changedTypes.forEach(reinstanceFor);
  const aoi = kids(kid(ctl, 'AddOnInstructionDefinitions'), 'AddOnInstructionDefinition');
  if (aoi.length) report.skipped.push(`${aoi.length} Add-On Instruction definition(s): kept out, calls to them show as unsimulated boxes`);
  const mods = kids(kid(ctl, 'Modules'), 'Module');
  if (mods.length) report.skipped.push(`${mods.length} I/O module(s): hardware config is not modelled`);
  for (const tg of kids(kid(ctl, 'Tags'), 'Tag')) mergeTag(P.tags, parseTag(tg), report);
  for (const pe of kids(kid(ctl, 'Programs'), 'Program')){
    const name = pe.getAttribute('Name');
    let prog = P.programs.find(p => lc(p.name) === lc(name));
    if (!prog){ prog = {name, tags:[], routines:[]}; P.programs.push(prog); }
    if (pe.getAttribute('MainRoutineName')) prog.main = pe.getAttribute('MainRoutineName');
    for (const tg of kids(kid(pe, 'Tags'), 'Tag')) mergeTag(prog.tags, parseTag(tg), report);
    for (const re of kids(kid(pe, 'Routines'), 'Routine')){
      const type = re.getAttribute('Type') || 'RLL';
      const r = {name:re.getAttribute('Name'), type, rungs:[]};
      if (type === 'RLL'){
        for (const ru of kids(kid(re, 'RLLContent'), 'Rung')){
          r.rungs.push({comment:cdata(kid(ru, 'Comment')), text:cdata(kid(ru, 'Text')).replace(/\s*\n\s*/g, ' ') || ';'});
        }
      } else if (type === 'ST'){
        r.st = kids(kid(re, 'STContent'), 'Line').map(l => cdata(l)).join('\n');
      } else report.skipped.push(`${type} routine ${r.name}: listed, but only ladder and structured text routines are editable`);
      const i = prog.routines.findIndex(x => lc(x.name) === lc(r.name));
      if (i >= 0) prog.routines[i] = r; else prog.routines.push(r);
      report.routines.push({prog:prog.name, name:r.name, rungs:r.rungs.length, type});
    }
  }
  if (!P.programs.length) P.programs.push({name:'MainProgram', tags:[], routines:[]});
  applyLiterals();
  return report;
}

/* ---------------- L5X export ---------------- */
const xa = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const cd = s => '<![CDATA[' + String(s).replace(/]]>/g, ']]]]><![CDATA[>') + ']]>';
const radix = t => t === 'REAL' ? 'Float' : isAtomic(t) ? 'Decimal' : 'NullType';
function orderedUdts(){
  const out = [], seen = new Set();
  const visit = u => { if (seen.has(u.name)) return; seen.add(u.name);
    for (const m of u.members){ const d = P.udts.find(x => lc(x.name) === lc(m.type)); if (d) visit(d); } out.push(u); };
  P.udts.forEach(visit); return out;
}
function udtXML(u){
  const L = [`<DataType Name="${xa(u.name)}" Family="NoFamily" Class="User">`];
  if (u.description) L.push(`<Description>\n${cd(u.description)}\n</Description>`);
  L.push('<Members>');
  const out = []; let host = null, hostBits = 0;
  for (const m of u.members){
    if (m.type === 'BOOL' && !m.dim){
      if (!host || hostBits >= 8){ host = `ZZZZZZZZZZ${u.name}${out.length}`; hostBits = 0;
        out.push(`<Member Name="${xa(host)}" DataType="SINT" Dimension="0" Radix="Decimal" Hidden="true" ExternalAccess="Read/Write"/>`); }
      const desc = m.description ? `>\n<Description>\n${cd(m.description)}\n</Description>\n</Member>` : '/>';
      out.push(`<Member Name="${xa(m.name)}" DataType="BIT" Dimension="0" Radix="Decimal" Hidden="false" Target="${xa(host)}" BitNumber="${hostBits++}" ExternalAccess="Read/Write"${desc}`);
    } else {
      host = null;
      const dim = m.type === 'BOOL' ? Math.ceil(m.dim / 32) * 32 : (m.dim || 0);
      const desc = m.description ? `>\n<Description>\n${cd(m.description)}\n</Description>\n</Member>` : '/>';
      out.push(`<Member Name="${xa(m.name)}" DataType="${xa(m.type)}" Dimension="${dim}" Radix="${radix(m.type)}" Hidden="false" ExternalAccess="Read/Write"${desc}`);
    }
  }
  L.push(...out, '</Members>', '</DataType>');
  return L.join('\n');
}
const dv = (t, v) => t === 'REAL' ? (Number.isInteger(v) ? v.toFixed(1) : String(v)) : String(Math.trunc(v || 0));
function decStruct(type, v, tagName, attrs){
  const L = [`<${tagName} ${attrs}DataType="${xa(type)}">`];
  for (const m of membersOf(type) || []){
    const mv = v ? v[m.name] : undefined;
    if (m.dim){
      L.push(`<ArrayMember Name="${xa(m.name)}" DataType="${xa(m.type)}" Dimensions="${m.dim}"${isAtomic(m.type) ? ` Radix="${radix(m.type)}"` : ''}>`);
      for (let i = 0; i < m.dim; i++){
        if (isAtomic(m.type)) L.push(`<Element Index="[${i}]" Value="${dv(m.type, mv && mv[i])}"/>`);
        else L.push(`<Element Index="[${i}]">`, decStruct(m.type, mv && mv[i], 'Structure', ''), '</Element>');
      }
      L.push('</ArrayMember>');
    } else if (isAtomic(m.type)){
      L.push(`<DataValueMember Name="${xa(m.name)}" DataType="${m.type}"${m.type === 'BOOL' ? '' : ` Radix="${radix(m.type)}"`} Value="${dv(m.type, mv)}"/>`);
    } else L.push(decStruct(m.type, mv, 'StructureMember', `Name="${xa(m.name)}" `));
  }

  return L.join('\n');
}
function tagXML(t, withData){
  if (t.alias) return `<Tag Name="${xa(t.name)}" TagType="Alias" AliasFor="${xa(t.alias)}" ExternalAccess="Read/Write">${t.description ? `\n<Description>\n${cd(t.description)}\n</Description>\n` : ''}</Tag>`;
  const atomic = isAtomic(t.type);
  const L = [`<Tag Name="${xa(t.name)}" TagType="Base" DataType="${xa(t.type)}"${t.dim ? ` Dimensions="${t.dim}"` : ''}${atomic ? ` Radix="${radix(t.type)}"` : ''} Constant="false" ExternalAccess="Read/Write">`];
  if (t.description) L.push(`<Description>\n${cd(t.description)}\n</Description>`);
  const known = atomic || membersOf(t.type);
  if (withData && known){
    L.push('<Data Format="Decorated">');
    if (t.dim){
      L.push(`<Array DataType="${xa(t.type)}" Dimensions="${t.dim}"${atomic ? ` Radix="${radix(t.type)}"` : ''}>`);
      for (let i = 0; i < t.dim; i++){
        if (atomic) L.push(`<Element Index="[${i}]" Value="${dv(t.type, t.value[i])}"/>`);
        else L.push(`<Element Index="[${i}]">`, decStruct(t.type, t.value[i], 'Structure', ''), '</Element>');
      }
      L.push('</Array>');
    } else if (atomic) L.push(`<DataValue DataType="${t.type}" Radix="${radix(t.type)}" Value="${dv(t.type, t.value)}"/>`);
    else L.push(decStruct(t.type, t.value, 'Structure', ''));

}
function rungsXML(prog, rt){
  return rt.rungs.map((r, i) => {
    ensureAst(r);
    let text = r.text;
    if (r.ast){
      /* write live timer/counter presets into the rung text so the two stay in step */
      const copy = JSON.parse(JSON.stringify(r.ast, strip));
      walk(copy, n => { const d = I[n.name]; if (d && d.lv){ const t = struct(n.args[d.sa], {prog}); if (t) for (const [ix, f] of Object.entries(d.lv)) n.args[ix] = String(Math.floor(t[f])); } });
      text = serialize(copy) + ';';
    }
    return `<Rung Number="${i}" Type="N">\n${r.comment ? `<Comment>\n${cd(r.comment)}\n</Comment>\n` : ''}<Text>\n${cd(text)}\n</Text>\n</Rung>`;
  }).join('\n');
}
function exportDate(){
  const d = new Date(), p = n => String(n).padStart(2, '0');

}
function exportRoutine(pi, ri, withData){
  const prog = P.programs[pi], rt = prog.routines[ri];
  const L = [];
  L.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>');
  const st = rt.type === 'ST';
  L.push(`<RSLogix5000Content SchemaRevision="1.0" SoftwareRevision="${xa(P.rev || '32.00')}" TargetName="${xa(rt.name)}" TargetType="Routine" TargetSubType="${st ? 'ST' : 'RLL'}" ContainsContext="true" ExportDate="${exportDate()}" ExportOptions="References NoRawData L5KData DecoratedData Context Dependencies ForceProtectedEncoding AllProjDocTrans">`);
  L.push(`<Controller Use="Context" Name="${xa(P.name)}">`);
  const udts = orderedUdts();
  if (udts.length) L.push('<DataTypes Use="Context">', ...udts.map(udtXML), '</DataTypes>');
  if (P.tags.length) L.push('<Tags Use="Context">', ...P.tags.map(t => tagXML(t, withData)), '</Tags>');
  L.push('<Programs Use="Context">', `<Program Use="Context" Name="${xa(prog.name)}">`);
  if (prog.tags.length) L.push('<Tags Use="Context">', ...prog.tags.map(t => tagXML(t, withData)), '</Tags>');
  const body = st ? ['<STContent>', ...String(rt.st || '').split('\n').map((ln, i) => `<Line Number="${i}">\n${cd(ln)}\n</Line>`), '</STContent>'] : ['<RLLContent>', rungsXML(prog, rt), '</RLLContent>'];
  L.push('<Routines Use="Context">', `<Routine Use="Target" Name="${xa(rt.name)}" Type="${st ? 'ST' : 'RLL'}">`, ...body, '</Routine>', '</Routines>', '</Program>', '</Programs>', '</Controller>', '</RSLogix5000Content>');
  return L.join('\n');
}

function flatTags(){
  const out = [];
  const go = (path, type, dim, v) => {
    if (out.length > 4000) return;
    if (dim > 0){ for (let i = 0; i < Math.min(dim, 64); i++) go(`${path}[${i}]`, type, 0, v && v[i]); return; }
    if (isAtomic(type)){ out.push([path, type, typeof v === 'number' ? v : 0]); return; }
    for (const m of membersOf(type) || []) go(path + '.' + m.name, m.type, m.dim || 0, v && v[m.name]);
  };
  for (const t of P.tags) if (!t.alias) go(t.name, t.type, t.dim || 0, t.value);
  for (const pr of P.programs) for (const t of pr.tags) if (!t.alias) go(`Program:${pr.name}.${t.name}`, t.type, t.dim || 0, t.value);
  return out;
}
function bridgePush(){ if (BR.ws && BR.ws.readyState === 1 && CONN.online) BR.ws.send(JSON.stringify({type:'values', mode:CONN.plc && CONN.plc.mode, tags:flatTags()})); }

function countErrors(){
  let rungs = 0, ops = 0;
  for (const prog of P.programs) for (const rt of prog.routines){
    if (rt.type === 'ST'){ if (stAst(rt).err) rungs++; continue; }
    for (const r of rt.rungs){
      ensureAst(r); if (!r.ast){ rungs++; continue; }
      walk(r.ast, n => { n.args.forEach((a, i) => {
        if (!a || a === '?' || LIT.test(a) || (n.name === 'CPT' && i === 1)) return;
        if (n.name === 'JSR' && i === 0){ if (!prog.routines.some(x => lc(x.name) === lc(a))) ops++; return; }
        if (!resolve(a, prog)) ops++; }); });
    }
  }
  return {rungs, ops};
}

const ACOND = {on:'is on', off:'is off', '>':'>', '>=':'≥', '<':'<', '<=':'≤', '=':'=', '<>':'≠'};
const ALARMS = {st:{},
  reset(){ this.st = {}; },
  test(a){ const v = hval(a.tag); if (v == null) return false; const k = Number(a.value);
    switch (a.cond){ case 'on': return !!v; case 'off': return !v; case '>': return v > k; case '>=': return v >= k; case '<': return v < k; case '<=': return v <= k; case '=': return v === k; case '<>': return v !== k; } return false; },
  check(){
    if (!CONN.online) return;
    let changed = false;
    for (const a of P.hmi.alarms){
      const s = this.st[a.id] || (this.st[a.id] = {active:false, acked:true});
      const act = this.test(a);
      if (act && !s.active){ s.active = true; s.acked = false; s.at = Date.now(); changed = true; }
      else if (!act && s.active){ s.active = false; s.out = Date.now(); changed = true; }
    }
    if (changed) renderCtl();
  },
  list(){ return P.hmi.alarms.filter(a => { const s = this.st[a.id]; return s && (s.active || !s.acked); }).map(a => ({a, s:this.st[a.id]})).sort((x, y) => y.s.at - x.s.at); },
  unacked(){ return P.hmi.alarms.filter(a => { const s = this.st[a.id]; return s && !s.acked; }).length; },
  ack(id){ if (id === '*') for (const k in this.st) this.st[k].acked = true; else if (this.st[id]) this.st[id].acked = true; },
  html(design){
    const rows = this.list();
    const body = rows.length ? rows.map(({a, s}) => `<tr class="sev-${esc(a.sev)}${s.acked ? '' : ' un'}"><td class="mono">${new Date(s.at).toLocaleTimeString()}</td><td>${esc(a.sev)}</td><td>${esc(a.msg)}</td><td>${s.active ? (s.acked ? 'Active' : 'Active, not acknowledged') : 'Normal, not acknowledged'}</td><td>${s.acked ? '' : `<button data-ack="${a.id}">Ack</button>`}</td></tr>`).join('')
      : `<tr><td colspan="5" class="muted">${design ? 'Alarms show here in Run mode. Define them under HMI › Alarms.' : CONN.online ? 'No active alarms.' : 'Offline.'}</td></tr>`;
    return `<div class="halarms"><div class="ah"><b>Alarms</b><span class="muted">${rows.filter(r => r.s.active).length} active</span>${rows.some(r => !r.s.acked) ? '<button data-ack="*">Ack all</button>' : ''}</div><div class="aw"><table><tbody>${body}</tbody></table></div></div>`;
  }
};

  renderAll();
});
$('#view').addEventListener('click', e => {
  if (state.view.kind !== 'io') return;
  const t = e.target;
  const pt = t.closest('[data-pt]'); if (pt && !pt.disabled){ writeTag(pt.dataset.pt, 0, true); ioTick(); return; }
  const dc = t.closest('[data-delcard]'); if (dc){ edit(() => P.io.cards.splice(+dc.dataset.delcard, 1)); renderAll(); return; }
  const am = t.closest('[data-addmodel]');
  if (am){ const k = am.dataset.addmodel, n = P.io.models.filter(m => m.kind === k).length + 1;
    const m = k === 'tank' ? {kind:'tank', name:'Tank' + n, fill:'Fill_Valve', drain:'Drain_Valve', level:'Tank_Level', hi:'Tank_High', lo:'Tank_Low', fillRate:12, drainRate:8, hiSP:90, loSP:10, start:20}
      : {kind:'conveyor', name:'Conveyor' + n, motor:'Conv_Motor', pe1:'PE_Entry', pe2:'PE_Exit', pe1At:15, pe2At:90, speed:20, feed:4};
    edit(() => P.io.models.push(m)); renderAll(); return; }
  const ma = t.closest('[data-mact]'); if (ma){ if (!CONN.online){ toast('Go online first.'); return; } toPLC({op:'model', idx:+ma.dataset.mi, action:ma.dataset.mact}); return; }
  const mt = t.closest('[data-mtags]');
  if (mt){ const m = P.io.models[+mt.dataset.mtags]; const add = [];
    for (const [k, , kind, type] of MODEL_F[m.kind]) if (kind === 'tag' && m[k] && validName(m[k]) && !resolveAny(m[k])) add.push(newTag(m[k], type || 'BOOL', 0, `${m.name} model`));
    if (!add.length){ toast('All of this model\'s tags exist.'); return; }
    edit(() => P.tags.push(...add)); toast(`Created ${add.map(x => x.name).join(', ')}.`); renderAll(); return; }
  const dm = t.closest('[data-delmodel]'); if (dm){ edit(() => P.io.models.splice(+dm.dataset.delmodel, 1)); renderAll(); }
});
$('#view').addEventListener('input', e => { const r = e.target.closest('[data-ain]'); if (r && state.view.kind === 'io') writeTag(r.dataset.ain, Number(r.value)); });
$('#view').addEventListener('change', e => {
  const t = e.target; if (state.view.kind !== 'io' || t.dataset.mf2 == null) return;
  const m = P.io.models[+t.dataset.mi], k = t.dataset.mf2;
  edit(() => { m[k] = t.type === 'number' ? Number(t.value) : t.value.trim(); }); renderOrg(); renderCtl();
  if (k === 'name' || (MODEL_F[m.kind].find(x => x[0] === k) || [])[2] === 'tag') renderIO();
});

/* ---------------- sample project ---------------- */
function sampleProject(){
  const l5x = $('#sampleL5X').textContent.trim();
  P = emptyProject(l5x ? 'Lab5' : 'Demo'); P.programs = [];
  if (l5x) { try { importL5X(l5x); } catch(e){ P = emptyProject('Lab5'); } }
  normalize(P);
  addDemo(P);
  return P;
}
/* the demo cell: ladder timers and counters, a structured text tank routine called by JSR, I/O cards, two process models and two HMI screens */
function addDemo(p){
  const prog = p.programs[0] || (p.programs[0] = {name:'MainProgram', tags:[], routines:[]});
  const add = (name, type, desc, dim) => { if (!p.tags.some(t => t.name === name)) p.tags.push(newTag(name, type, dim || 0, desc)); };
  add('Start_PB', 'BOOL', 'Start pushbutton'); add('Stop_PB', 'BOOL', 'Stop pushbutton'); add('Reset_PB', 'BOOL', 'Batch reset');
  add('Motor_Run', 'BOOL', 'Motor running (seal-in)'); add('Run_Timer', 'TIMER', '5 s cycle timer'); add('Cycle_Count', 'COUNTER', 'Cycles per batch');
  add('Batch_Done', 'BOOL', 'Latched when the batch count is reached'); add('Halfway_Lamp', 'BOOL', 'On during the second half of each cycle'); add('Timer_Copy', 'DINT', 'Copy of the timer accumulator');
  add('Conv_Motor', 'BOOL', 'Conveyor motor output'); add('PE_Entry', 'BOOL', 'Entry photo-eye'); add('PE_Exit', 'BOOL', 'Exit photo-eye'); add('Parts_Done', 'COUNTER', 'Parts past the exit eye');
  add('Auto_Mode', 'BOOL', 'Tank automatic mode (HMI maintained button)'); add('Fill_Valve', 'BOOL', 'Tank fill valve'); add('Drain_Valve', 'BOOL', 'Tank drain valve');
  add('Tank_Level', 'REAL', 'Tank level, %'); add('Tank_High', 'BOOL', 'High level switch'); add('Tank_Low', 'BOOL', 'Low level switch');
  add('Level_SP', 'REAL', 'Drain once the level reaches this, %'); add('Tank_State', 'DINT', '0 idle, 1 filling, 2 draining');
  add('Slot1_DI', 'DINT', 'DI16 card in slot 1'); add('Slot2_DO', 'DINT', 'DO16 card in slot 2'); add('Slot3_AI', 'REAL', 'AI4 card in slot 3', 4);
  const sp = p.tags.find(t => t.name === 'Level_SP'); if (sp && !sp.value) sp.value = 80;
  const at = p.tags.find(t => t.name === 'Auto_Mode'); if (at) at.value = 1;
  if (!prog.routines.some(r => r.name === 'Demo_Timers')) prog.routines.push({name:'Demo_Timers', type:'RLL', rungs:[
    {comment:'Start/stop seal-in. Press Start on the HMI, or double-click Start_PB while online.', text:'[XIC(Start_PB) ,XIC(Motor_Run) ]XIO(Stop_PB)OTE(Motor_Run);'},
    {comment:'Cycle timer runs while the motor runs, and restarts itself each time it finishes.', text:'XIC(Motor_Run)XIO(Run_Timer.DN)TON(Run_Timer,5000,0);'},
    {comment:'', text:'XIC(Run_Timer.DN)CTU(Cycle_Count,3,0);'},
    {comment:'', text:'XIC(Cycle_Count.DN)OTL(Batch_Done);'},
    {comment:'', text:'XIC(Reset_PB)[RES(Cycle_Count) ,OTU(Batch_Done) ,RES(Parts_Done) ];'},
    {comment:'', text:'GEQ(Run_Timer.ACC,2500)OTE(Halfway_Lamp);'},
    {comment:'', text:'XIC(Motor_Run)MOV(Run_Timer.ACC,Timer_Copy);'},
  ]});
  const dt = prog.routines.find(r => r.name === 'Demo_Timers');
  if (dt && !dt.rungs.some(r => /Conv_Motor/.test(r.text))) dt.rungs.push(
    {comment:'The conveyor model runs while the motor runs. Parts are counted at the exit eye.', text:'XIC(Motor_Run)OTE(Conv_Motor);'},
    {comment:'', text:'XIC(PE_Exit)CTU(Parts_Done,9999,0);'},
    {comment:'Input 0 on the slot 1 card drives output 0 on slot 2. Try it on the I/O page.', text:'XIC(Slot1_DI.0)OTE(Slot2_DO.0);'},
    {comment:'Call the structured text tank routine every scan.', text:'JSR(Tank_Control,0);'});
  if (!prog.routines.some(r => r.name === 'Tank_Control')) prog.routines.push({name:'Tank_Control', type:'ST', rungs:[], st:
`(* Tank control in structured text, called by JSR from Demo_Timers.
   In auto, fill until the level reaches Level_SP, then drain down to the low switch, and repeat. *)
IF NOT Auto_Mode THEN
  Fill_Valve := 0;
  Drain_Valve := 0;
ELSIF Tank_Level >= Level_SP THEN
  Fill_Valve := 0;
  Drain_Valve := 1;
ELSIF Tank_Low THEN
  Drain_Valve := 0;
  Fill_Valve := 1;
ELSIF NOT Drain_Valve THEN
  Fill_Valve := 1;
END_IF;

IF Fill_Valve THEN
  Tank_State := 1;
ELSIF Drain_Valve THEN
  Tank_State := 2;
ELSE
  Tank_State := 0;
END_IF;`});
  if (!p.io.cards.length) p.io.cards.push({kind:'DI16', tag:'Slot1_DI'}, {kind:'DO16', tag:'Slot2_DO'}, {kind:'AI4', tag:'Slot3_AI'});
  if (!p.io.models.length) p.io.models.push(
    {kind:'conveyor', name:'Conveyor1', motor:'Conv_Motor', pe1:'PE_Entry', pe2:'PE_Exit', pe1At:15, pe2At:90, speed:20, feed:3},
    {kind:'tank', name:'Tank1', fill:'Fill_Valve', drain:'Drain_Valve', level:'Tank_Level', hi:'Tank_High', lo:'Tank_Low', fillRate:12, drainRate:8, hiSP:90, loSP:10, start:20});
  const O = (t, x, y, w, h, extra) => ({id:newId(), t, x, y, w, h, tag:'', ...JSON.parse(JSON.stringify(HT[t].d)), ...extra});
  if (p.hmi.screens.length === 1 && !p.hmi.screens[0].objs.length) p.hmi.screens = [
    {name:'Line overview', objs:[
      O('text', 0, 0, 16, 2, {label:'Line 1 · demo cell', size:'l'}),
      O('mom', 0, 2, 4, 2, {tag:'Start_PB', label:'Start', color:'green'}), O('mom', 5, 2, 4, 2, {tag:'Stop_PB', label:'Stop', color:'red'}), O('mom', 10, 2, 4, 2, {tag:'Reset_PB', label:'Reset', color:'amber'}),
      O('lamp', 0, 5, 4, 3, {tag:'Motor_Run', label:'Motor', color:'green'}), O('lamp', 5, 5, 4, 3, {tag:'Halfway_Lamp', label:'Halfway', color:'blue'}), O('lamp', 10, 5, 4, 3, {tag:'Batch_Done', label:'Batch done', color:'amber'}),
      O('num', 15, 2, 6, 2, {tag:'Run_Timer.ACC', label:'Cycle timer', units:'ms'}), O('num', 15, 5, 6, 2, {tag:'Cycle_Count.ACC', label:'Cycles'}), O('num', 15, 8, 6, 2, {tag:'Parts_Done.ACC', label:'Parts out'}),
      O('bar', 22, 2, 2, 8, {tag:'Run_Timer.ACC', label:'Timer', min:0, max:5000, color:'green'}),
      O('nav', 25, 2, 7, 2, {label:'Tank screen', target:1}),
      O('model', 0, 10, 24, 5, {model:0}),
      O('trend', 0, 16, 24, 8, {pens:['Run_Timer.ACC','','',''], span:20, min:0, max:5000}),
      O('alarms', 0, 25, 32, 6),
    ]},
    {name:'Tank', objs:[
      O('text', 0, 0, 16, 2, {label:'Tank 1', size:'l'}),
      O('tank', 0, 2, 6, 11, {tag:'Tank_Level', label:'Level %', min:0, max:100, color:'blue'}),
      O('mnt', 8, 2, 6, 2, {tag:'Auto_Mode', label:'Auto mode', color:'blue'}),
      O('lamp', 8, 5, 4, 3, {tag:'Fill_Valve', label:'Fill valve', color:'green'}), O('lamp', 13, 5, 4, 3, {tag:'Drain_Valve', label:'Drain valve', color:'blue'}),
      O('lamp', 8, 9, 4, 3, {tag:'Tank_High', label:'High switch', color:'red'}), O('lamp', 13, 9, 4, 3, {tag:'Tank_Low', label:'Low switch', color:'amber'}),
      O('entry', 18, 1, 6, 3, {tag:'Level_SP', label:'Drain at %', min:10, max:95}),
      O('num', 18, 5, 6, 2, {tag:'Tank_Level', label:'Level', dec:1, units:'%'}),
      O('multi', 18, 8, 6, 2, {tag:'Tank_State', label:'State', states:'0=Idle:grey\n1=Filling:green\n2=Draining:blue'}),
      O('nav', 25, 2, 7, 2, {label:'Line overview', target:0}),
      O('trend', 0, 14, 24, 8, {pens:['Tank_Level','Level_SP','',''], span:60, min:0, max:100}),
      O('alarms', 0, 23, 32, 6),
    ]}];
  if (!p.hmi.alarms.length) p.hmi.alarms.push(
    {id:newId(), tag:'Tank_High', cond:'on', value:0, msg:'Tank 1 high level switch', sev:'High'},
    {id:newId(), tag:'Tank_Low', cond:'on', value:0, msg:'Tank 1 low level switch', sev:'Medium'},
    {id:newId(), tag:'Batch_Done', cond:'on', value:0, msg:'Batch complete, press Reset', sev:'Low'});
  const prev = P; P = p; applyLiterals(); P = prev;
  return p;
}

/* ---------------- boot ---------------- */
P = load();
if (P){
  const old = !P.hmi; normalize(P); reparseAll();
  if (old && P.name === 'Lab5' && P.programs.some(pr => pr.routines.some(r => r.name === 'Demo_Timers'))) addDemo(P);
} else P = sampleProject();
if (location.hash === '#hmi'){ state.view = {kind:'hmi', screen:0}; state.hmiRun = true; }
renderAll();
startConn();
if (state.hmiRun) setTimeout(() => goOnline().then(ok => { if (!ok){ state.hmiRun = false; renderAll(); } }), 900);
</script>
