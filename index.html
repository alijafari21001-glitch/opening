<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenRung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="OpenRung: open source ladder logic editor, virtual controller and HMI in the browser, with L5X import and export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: workbench. Controller box in the top bar | organizer tree | ladder, HMI or I/O canvas | inspector, status strip at the bottom. Wires go green when energized online. */
:root{
  --bg:#e9eeec; --panel:#fafcfb; --sunk:#dfe6e3; --line:#c3cdc9; --fg:#18221e; --muted:#5a6964;
  --wire:#55635e; --rail:#2a3531; --on:#13804f; --on-soft:#bfe8d2; --sel:#2c64c9; --sel-soft:#dbe6fa;
  --warn:#b4410d; --warn-soft:#fbe1d3; --box:#ffffff;
  --c-green:#178a52; --c-red:#c8372d; --c-amber:#c98a06; --c-blue:#2c64c9; --c-grey:#7d8a86; --hmi-bg:#f2f5f4; --hmi-num:#eef3f1;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --f-head:"IBM Plex Sans Condensed","Arial Narrow",var(--f-ui);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --panel:#171e1c; --sunk:#0c1110; --line:#2a3532; --fg:#dbe4e0; --muted:#8b9a95;
  --wire:#7b8a85; --rail:#b7c4bf; --on:#3fd08f; --on-soft:#173d2c; --sel:#79a6ff; --sel-soft:#1b2a45;
  --warn:#ff9a5c; --warn-soft:#3a2216; --box:#1c2422; --c-green:#3fd08f; --c-red:#ff6b5e; --c-amber:#f2b630; --c-blue:#79a6ff; --c-grey:#8b9a95; --hmi-bg:#131a18; --hmi-num:#0f1513; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --panel:#171e1c; --sunk:#0c1110; --line:#2a3532; --fg:#dbe4e0; --muted:#8b9a95;
  --wire:#7b8a85; --rail:#b7c4bf; --on:#3fd08f; --on-soft:#173d2c; --sel:#79a6ff; --sel-soft:#1b2a45;
  --warn:#ff9a5c; --warn-soft:#3a2216; --box:#1c2422; --c-green:#3fd08f; --c-red:#ff6b5e; --c-amber:#f2b630; --c-blue:#79a6ff; --c-grey:#8b9a95; --hmi-bg:#131a18; --hmi-num:#0f1513; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 10px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.danger{color:var(--warn)}
button.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
input,select,textarea{background:var(--box);border:1px solid var(--line);border-radius:4px;padding:4px 7px;min-width:0}
textarea{font-family:var(--f-mono);font-size:12.5px;width:100%;resize:vertical}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}

#app{display:flex;flex-direction:column;height:100%;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:600 18px/1 var(--f-head);letter-spacing:.02em;display:flex;align-items:baseline;gap:10px}
.brand .proj{font:500 13px var(--f-mono);color:var(--muted)}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.lamp.live{background:var(--on);box-shadow:0 0 0 3px var(--on-soft)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

.main{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr) 300px;min-height:0}
.org,.insp{background:var(--panel);overflow:auto;min-height:0}
.org{border-right:1px solid var(--line);padding:10px 0}
.insp{border-left:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
#view{flex:1;overflow:auto;padding:12px 16px 40px;min-height:0}

.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:14px}
.node{display:block;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:3px 12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node:hover{background:var(--sunk)}
.node.cur{background:var(--sel-soft);color:var(--sel);font-weight:600}
.grp{padding:8px 12px 2px;font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.node .cnt{color:var(--muted);font-size:11px;margin-left:4px}
.addrt{display:flex;gap:4px;padding:3px 12px}
.addrt input{flex:1;font-size:12px;min-width:0;width:100%}

.toolbar{display:flex;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;align-items:flex-end}
.tg{display:flex;flex-direction:column;gap:3px;flex:none}
.tg span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tg div{display:flex;gap:3px}
.ib{font:500 11px var(--f-mono);padding:4px 6px;min-width:40px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.ib b{font-weight:600;font-size:11px}
.ib i{font-style:normal;color:var(--muted);font-size:10px}

.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lhead h2{font:600 17px var(--f-head);margin:0;letter-spacing:.02em}
.rung{margin-bottom:4px;border-radius:6px}
.rung.rsel{background:var(--sel-soft)}
.rcmt{font:12px/1.4 var(--f-mono);color:var(--muted);white-space:pre-wrap;padding:6px 8px 2px 44px;max-width:900px}
.rrow{display:flex;align-items:flex-start}
.rnum{flex:none;width:38px;text-align:right;padding:22px 6px 0 0;font:600 12px var(--f-mono);color:var(--muted);cursor:pointer;user-select:none}
.rnum:hover{color:var(--sel)}
.rerr{font:12px var(--f-mono);color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:4px;margin:6px 0;cursor:pointer}
svg.lad{display:block;flex:none;user-select:none}
.lad .w{stroke:var(--wire);stroke-width:1.6}
.lad .w.p{stroke:var(--on);stroke-width:3}
.lad .rail{stroke:var(--rail);stroke-width:3}
.lad .hit{fill:transparent;stroke:none;cursor:pointer}
.lad .ins:hover .hit{fill:var(--sunk)}
.lad .sel .hit{fill:var(--sel-soft);stroke:var(--sel);stroke-width:1.5}
.lad .sym{stroke:var(--fg);stroke-width:2;fill:none}
.lad .cf{fill:transparent}
.lad .cf.on{fill:var(--on)}
.lad .op{font:500 11px var(--f-mono);fill:var(--fg)}
.lad .op.bad{fill:var(--warn);text-decoration:underline}
.lad .tiny{font:500 9px var(--f-mono);fill:var(--muted)}
.lad .tiny.on{fill:var(--on);font-weight:600}
.lad .coilt{font:600 10px var(--f-mono);fill:var(--fg)}
.lad .coilt.on{fill:var(--on)}
.lad .box{fill:var(--box);stroke:var(--fg);stroke-width:1.4}
.lad .box.on{stroke:var(--on);stroke-width:2.5}
.lad .bt{font:600 12px var(--f-mono);fill:var(--fg)}
.lad .bt.unk{fill:var(--warn)}
.lad .bl{font:10px var(--f-ui);fill:var(--muted)}
.lad .bv{font:10px var(--f-mono);fill:var(--muted)}
.lad .ph{fill:var(--panel);stroke:var(--muted);stroke-dasharray:3 2;cursor:pointer}
.lad .sel .ph{stroke:var(--sel);fill:var(--sel-soft)}
.lad .pht{font:600 12px var(--f-mono);fill:var(--muted);pointer-events:none}
.empty{padding:30px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

.insp h3{margin:0;font:600 16px var(--f-head);letter-spacing:.02em}
.insp h3 small{font:400 12px var(--f-ui);color:var(--muted);margin-left:6px}
.sect{display:flex;flex-direction:column;gap:8px}
.sect+.sect{border-top:1px solid var(--line);padding-top:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field input{font-family:var(--f-mono);font-size:12.5px}
.live{font:12px var(--f-mono);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.live b{color:var(--fg);font-weight:600}
.live b.t{color:var(--on)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{font-size:12.5px;padding:4px 9px}
.note{font-size:12.5px;color:var(--muted)}
.errmsg{font:12px var(--f-mono);color:var(--warn)}

.status{display:flex;gap:16px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted);background:var(--panel);border-top:1px solid var(--line);padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status .bad{color:var(--warn)}
.status .ok{color:var(--on)}

/* tags + data types */
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.vhead h2{font:600 17px var(--f-head);margin:0;letter-spacing:.02em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font-size:12.5px;padding:3px 9px}
.tabs button.cur{background:var(--sel-soft);color:var(--sel);border-color:var(--sel)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table.tt{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
.tt th{text-align:left;font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);background:var(--sunk)}
.tt td{padding:3px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tt tr:last-child td{border-bottom:0}
.tt .nm{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.tt input,.tt select{font-size:12.5px;padding:2px 6px;width:100%}
.tt input.num{font-family:var(--f-mono);width:110px;text-align:right;font-variant-numeric:tabular-nums}
.exp{border:0;background:none;padding:0 4px;color:var(--muted);font:12px var(--f-mono);width:20px}
.bitbtn{font:600 12px var(--f-mono);padding:1px 0;width:34px;border-radius:4px}
.bitbtn.on{background:var(--on);border-color:var(--on);color:#fff}
.bits{display:grid;grid-template-columns:repeat(16,minmax(28px,1fr));gap:3px;max-width:640px;padding:4px 0}
.bits button{font:500 10px var(--f-mono);padding:2px 0;border-radius:3px}
.bits button.on{background:var(--on);border-color:var(--on);color:#fff}
.addrow{display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.addrow .field input,.addrow .field select{width:auto}
.udt{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.udt .uh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.udt .uh input.name{font:600 14px var(--f-mono);width:200px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,14,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(760px,100%);max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font:600 19px var(--f-head);letter-spacing:.02em}
.sheet p{margin:0;max-width:65ch}
.sheet textarea{min-height:220px}
.report{font:12.5px var(--f-mono);background:var(--sunk);border-radius:6px;padding:10px;white-space:pre-wrap}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--sel);background:var(--sel-soft)}
.sheet ul{margin:0;padding-left:20px}
.sheet li{margin:3px 0}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;overflow:auto}
  .org{border-right:0;border-bottom:1px solid var(--line);max-height:200px}
  .insp{border-left:0;border-top:1px solid var(--line)}
  #view{min-height:55vh}
  html,body{height:auto}
  #app{height:auto;min-height:100%}
}

/* controller box, view tabs */
.vtabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vtabs button{border:0;border-radius:0;padding:5px 14px;font-weight:600;background:var(--panel)}
.vtabs button+button{border-left:1px solid var(--line)}
.vtabs button.cur{background:var(--sel-soft);color:var(--sel)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--c-red);color:#fff;font:600 11px/18px var(--f-mono);text-align:center}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.ctl button{font-size:12.5px;padding:4px 9px}
.ctl .ctlstate{border:0;background:none;font:600 13px var(--f-mono);padding:4px 4px;min-width:128px;text-align:left}
.ctl.on .lamp{background:var(--sel);box-shadow:0 0 0 3px var(--sel-soft)}
.ctl.run{background:var(--on-soft);border-color:var(--on)}
.ctl.run .lamp{background:var(--on);box-shadow:0 0 0 3px var(--on-soft);animation:beat 1.2s ease-in-out infinite}
.ctl.run .ctlstate{color:var(--on)}
.ctl.fault{background:var(--warn-soft);border-color:var(--warn)}
.ctl.fault .lamp{background:var(--warn);animation:blink .8s steps(2) infinite}
.ctl.fault .ctlstate{color:var(--warn)}
@keyframes beat{50%{box-shadow:0 0 0 5px var(--on-soft)}}
@keyframes blink{50%{opacity:.2}}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:5px 0 0 5px}
.seg button:last-child{border-radius:0 5px 5px 0;margin-left:-1px}
.seg button.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ctl.run .seg button.cur{background:var(--on);border-color:var(--on);color:#fff}
button:disabled{opacity:.45;cursor:default}
.ib.wide{flex-direction:row;gap:5px;min-width:0;padding:4px 8px;font:500 12px var(--f-ui)}
.ib.wide b{font:600 11.5px var(--f-ui)}
.ib.cur{background:var(--sel-soft);color:var(--sel);border-color:var(--sel)}
.hico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.tg.push{margin-left:auto}
.main.op{grid-template-columns:minmax(0,1fr)}
.main.op .org,.main.op .insp{display:none}
.addrt select{font-size:12px;padding:2px 3px;width:auto}
.sth{margin:6px 0 0;font:600 14px var(--f-head);letter-spacing:.02em}
/* structured text */
.stwrap{display:flex;flex-direction:column;gap:8px;max-width:980px}
.stsrc{font:13px/1.55 var(--f-mono);tab-size:2;min-height:260px;background:var(--box)}
.stwatch{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;font-size:12.5px}
.wrow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0}
.wrow b.t{color:var(--on)}
/* HMI canvas: an operator panel. Grid dots show only while designing. */
.hcanvas{position:relative;background:var(--hmi-bg);border:1px solid var(--line);border-radius:8px;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:20px 20px;background-position:-10px -10px;touch-action:none}
.hcanvas.run{background-image:none}
.hempty{position:absolute;inset:40px 40px auto;color:var(--muted);text-align:center;font-size:13px}
.hempty.small{position:static;padding:8px;font-size:12px}
.ho{position:absolute;padding:3px;user-select:none;-webkit-user-select:none}
.hcanvas:not(.run) .ho{cursor:move}
.hcanvas:not(.run) .ho:hover{outline:1px dashed var(--muted)}
.ho.sel{outline:2px solid var(--sel)!important;outline-offset:1px;z-index:2}
.rz{position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;background:var(--sel);border:2px solid var(--panel);border-radius:3px;cursor:nwse-resize;display:none}
.ho.sel .rz{display:block}
.hcanvas:not(.run) .ho *{pointer-events:none}
.hcanvas:not(.run) .ho .rz{pointer-events:auto}
.hl{font:500 11px var(--f-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-green{--hc:var(--c-green)}.c-red{--hc:var(--c-red)}.c-amber{--hc:var(--c-amber)}.c-blue{--hc:var(--c-blue)}.c-grey{--hc:var(--c-grey)}
.hbtn{height:100%;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:7px;font:600 14px var(--f-ui);background:var(--box);border:2px solid var(--hc,var(--line));color:var(--fg);box-shadow:0 2px 0 var(--hc,var(--line));text-align:center;line-height:1.1;padding:2px}
.hcanvas.run .hbtn{cursor:pointer}
.hbtn.on{background:var(--hc);color:#fff;box-shadow:none;transform:translateY(2px)}
.hbtn.nav{border-color:var(--line);box-shadow:0 2px 0 var(--line);justify-content:space-between;padding:0 12px}
.hbtn.nav span{font-size:20px;color:var(--muted)}
.bad{outline:1px dashed var(--warn);outline-offset:-1px}
.hlamp{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bulb{width:30px;height:30px;border-radius:50%;background:var(--sunk);border:2px solid var(--line)}
.bulb.on{background:var(--hc);border-color:var(--hc);box-shadow:0 0 0 4px color-mix(in srgb,var(--hc) 25%,transparent),0 0 14px var(--hc)}
.hmulti{height:100%;display:flex;flex-direction:column;justify-content:center;padding:2px 10px;border-radius:7px;background:var(--box);border:1px solid var(--line);border-left:6px solid var(--hc)}
.hmulti b{font:600 15px var(--f-ui)}
.hnum{height:100%;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:1px 10px;position:relative;overflow:hidden;border-radius:6px;background:var(--hmi-num);border:1px solid var(--line)}
.hnum b{font:600 17px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.hnum .hl,.hmulti .hl{font-size:10px;line-height:1.2}
.hnum i{font:normal 11px var(--f-mono);color:var(--muted);position:absolute;right:14px;bottom:8px}
.hent .hin{font:600 15px var(--f-mono);padding:1px 6px;width:100%}
.htext{height:100%;display:flex;align-items:center;font-family:var(--f-head);font-weight:600;letter-spacing:.02em}
.htext.s-s{font-size:13px}.htext.s-m{font-size:17px}.htext.s-l{font-size:24px}
.hbar{height:100%;display:flex;flex-direction:column;align-items:center;gap:2px}
.hbar .track{flex:1;width:70%;max-width:26px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.hbar .fill{width:100%;background:var(--hc)}
.hbar b{font:600 11px var(--f-mono)}
.htank{height:100%;display:flex;flex-direction:column;gap:3px}
.vessel{flex:1;position:relative;border:2px solid var(--fg);border-top-width:1px;border-radius:4px 4px 14px 14px;overflow:hidden;background:var(--sunk)}
.vessel .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--hc) 75%,transparent);transition:height .2s linear}
.vessel b{position:absolute;inset:auto 0 45%;text-align:center;font:600 15px var(--f-mono);text-shadow:0 0 3px var(--box)}
.htrend,.hmodel{display:block}
.tg-bg{fill:var(--box);stroke:var(--line)}
.tg-l{stroke:var(--line);stroke-width:1}
.tg-t{font:10px var(--f-mono);fill:var(--muted)}
.tg-v{font:11px var(--f-mono);fill:var(--fg)}
.m-belt{fill:var(--sunk);stroke:var(--fg);stroke-width:1.5}
.m-belt.on{stroke:var(--on);stroke-dasharray:6 4;animation:belt .6s linear infinite}
@keyframes belt{to{stroke-dashoffset:-10}}
.m-part{fill:var(--c-amber);stroke:var(--fg);stroke-width:1}
.m-beam{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 3}
.m-beam.on{stroke:var(--c-red)}
.m-eye{fill:var(--sunk);stroke:var(--fg)}
.m-eye.on{fill:var(--c-red)}
.m-vessel{fill:var(--sunk);stroke:var(--fg);stroke-width:2}
.m-liquid{fill:color-mix(in srgb,var(--c-blue) 70%,transparent)}
.m-sp{stroke:var(--muted);stroke-dasharray:4 3}
.m-valve{fill:var(--sunk);stroke:var(--fg)}
.m-valve.on{fill:var(--on)}
.halarms{height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--box);overflow:hidden;font-size:12.5px}
.ah{display:flex;gap:10px;align-items:center;padding:4px 8px;background:var(--sunk);border-bottom:1px solid var(--line)}
.ah button,.halarms td button{font-size:11.5px;padding:1px 8px}
.ah button{margin-left:auto}
.aw{flex:1;overflow:auto}
.halarms table{width:100%;border-collapse:collapse;font-size:inherit}
.halarms td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.halarms tr.sev-High td:nth-child(2){color:var(--c-red);font-weight:600}
.halarms tr.sev-Medium td:nth-child(2){color:var(--c-amber);font-weight:600}
.halarms tr.un td{font-weight:600}
.halarms tr.un.sev-High{animation:blink 1s steps(2) 3}
/* I/O rack */
.rack{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;width:300px;max-width:100%;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--rail)}
.ch{display:flex;gap:8px;align-items:center}
.ch button{margin-left:auto;padding:0 7px}
.pts{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pts.an{grid-template-columns:1fr}
.pt{font:600 11px var(--f-mono);padding:4px 0;border-radius:4px}
.pt.on{background:var(--on);border-color:var(--on);color:#fff}
.pt.out:disabled{opacity:1;cursor:default}
.pt.out.on{background:var(--c-amber);border-color:var(--c-amber)}
.ach{display:grid;grid-template-columns:18px 1fr 54px;gap:8px;align-items:center;font-size:12px}
.ach b{text-align:right;font-variant-numeric:tabular-nums}
.track.h{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.track.h .fill{height:100%;background:var(--hc)}
.mgrid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:14px;align-items:start}
.mview{background:var(--box);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mform{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.mform input.miss{border-color:var(--warn)}
.recent{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.rrec{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;font-size:13px}
@media (max-width:900px){.mgrid{grid-template-columns:minmax(0,1fr)}.ctl .ctlstate{min-width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}

<div id="app">
  <header class="top">
    <div class="brand">OpenRung <span class="proj" id="projName"></span></div>
    <nav class="vtabs" aria-label="Views"><button id="tabLogic" class="cur">Logic</button><button id="tabHmi">HMI</button></nav>
    <div class="ctl" id="ctl" aria-label="Controller">
      <span class="lamp" id="lamp"></span><button id="ctlState" class="ctlstate" title="Controller details">Starting…</button>
      <button id="onlineBtn" class="primary">Go online</button>
      <div class="seg" role="group" aria-label="Controller mode"><button data-mode="PROG" title="Program mode: the scan stops and outputs turn off">Program</button><button data-mode="RUN" title="Run mode: the controller scans the logic">Run</button></div>
      <button id="dlBtn" title="Send the open project to the controller">Download</button><button id="ulBtn" title="Replace the open project with the one in the controller">Upload</button>
      <button id="editsBtn" class="primary" hidden title="Send your edits while the controller keeps its tag values">Apply edits</button><button id="clrBtn" class="danger" hidden>Clear fault</button>
    </div>

      <button id="projBtn">Project</button>
      <button id="acctBtn" title="Sign in to keep your projects online">Sign in</button>
      <button id="importBtn">Import L5X</button>
      <button id="exportBtn">Export L5X</button>

      <button id="aboutBtn">About</button>
    </div>

  </header>
  <div class="main">

    <section class="work">

  </div>

</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script type="text/plain" id="sampleL5X"></script>
<script>
"use strict";
/* OpenRung: a clean-room ladder logic editor and simulator.
   Exchanges routines with other tools through the public L5X XML format.
   MIT License. */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lc = s => String(s).toLowerCase();

/* ================= CORE: shared by the editor and the virtual controller (runs in a Web Worker) ================= */
function CORE(getP){
"use strict";
const lc = s => String(s).toLowerCase();
/* ---------------- data types ---------------- */
const ATOMIC = {BOOL:1, SINT:8, INT:16, DINT:32, LINT:64, REAL:32};
const BUILTIN = {
  TIMER:   [['PRE','DINT'],['ACC','DINT'],['EN','BOOL'],['TT','BOOL'],['DN','BOOL']],
  COUNTER: [['PRE','DINT'],['ACC','DINT'],['CU','BOOL'],['CD','BOOL'],['DN','BOOL'],['OV','BOOL'],['UN','BOOL']],
  CONTROL: [['LEN','DINT'],['POS','DINT'],['EN','BOOL'],['EU','BOOL'],['DN','BOOL'],['EM','BOOL'],['ER','BOOL'],['UL','BOOL'],['IN','BOOL'],['FD','BOOL']],
};
const isAtomic = t => Object.prototype.hasOwnProperty.call(ATOMIC, t);
function membersOf(type){
  if (BUILTIN[type]) return BUILTIN[type].map(([name,t]) => ({name, type:t, dim:0}));
  const u = getP().udts.find(u => lc(u.name) === lc(type));
  return u ? u.members : null;
}
function instantiate(type, dim){
  if (dim > 0) return Array.from({length:dim}, () => instantiate(type, 0));
  if (isAtomic(type)) return 0;
  const o = {};
  for (const m of membersOf(type) || []) o[m.name] = instantiate(m.type, m.dim || 0);
  return o;
}
function wrap(type, v){
  v = Number(v); if (!isFinite(v)) v = 0;
  switch (type){
    case 'BOOL': return v ? 1 : 0;
    case 'REAL': return Math.fround(v);
    case 'SINT': return (Math.round(v) << 24) >> 24;
    case 'INT':  return (Math.round(v) << 16) >> 16;
    case 'DINT': return Math.round(v) | 0;
    default: return Math.round(v);
  }
}

/* ---------------- operand resolution ---------------- */
function findTag(name, prog){
  const n = lc(name);
  return (prog && prog.tags.find(t => lc(t.name) === n)) || getP().tags.find(t => lc(t.name) === n);
}
function resolve(path, prog, depth){
  path = String(path || '').trim();
  const m = /^[A-Za-z_]\w*/.exec(path);
  if (!m || (depth || 0) > 8) return null;
  const tag = findTag(m[0], prog);
  if (!tag) return null;
  if (tag.alias) return resolve(tag.alias + path.slice(m[0].length), prog, (depth || 0) + 1);
  let holder = tag, key = 'value', type = tag.type, dim = tag.dim || 0, i = m[0].length;
  while (i < path.length){
    const c = path[i];
    if (c === '['){
      if (!dim) return null;
      const j = path.indexOf(']', i); if (j < 0) return null;
      const ix = path.slice(i + 1, j).trim();
      let n;
      if (/^\d+$/.test(ix)) n = +ix;
      else { const r = resolve(ix, prog, (depth || 0) + 1); n = r && isAtomic(r.type) ? r.get() : NaN; }
      if (!(Number.isInteger(n) && n >= 0 && n < dim)) return null;
      holder = holder[key]; key = n; dim = 0; i = j + 1;
    } else if (c === '.'){
      if (dim) return null;
      const mm = /^\.(\w+)/.exec(path.slice(i)); if (!mm) return null;
      const id = mm[1];
      if (/^\d+$/.test(id)){
        if (!isAtomic(type) || type === 'BOOL' || type === 'REAL') return null;
        const bit = +id; if (bit >= ATOMIC[type] || i + mm[0].length !== path.length) return null;
        return bitRef(holder, key, bit, type);
      }
      const mem = (membersOf(type) || []).find(x => lc(x.name) === lc(id));
      if (!mem) return null;
      holder = holder[key]; key = mem.name; type = mem.type; dim = mem.dim || 0; i += mm[0].length;
    } else return null;
  }
  if (holder == null || holder[key] === undefined) return null;
  const h = holder, k = key, t = type, d = dim;
  return {type:t, dim:d, get(){ return h[k]; }, set(v){ if (isAtomic(t) && !d) h[k] = wrap(t, v); }};
}
function bitRef(h, k, bit, type){
  return {type:'BOOL', dim:0, get(){ return (h[k] >>> bit) & 1; },
    set(v){ const cur = h[k] | 0; h[k] = wrap(type, v ? (cur | (1 << bit)) : (cur & ~(1 << bit))); }};
}
const LIT = /^[-+]?(\d+\.?\d*([eE][-+]?\d+)?|\.\d+)$|^(2|8|16)#[0-9a-fA-F_]+$/;
function parseLit(s){
  const m = /^(2|8|16)#(.+)$/.exec(s);
  return m ? parseInt(m[2].replace(/_/g,''), +m[1]) : Number(s);
}
function num(arg, c){
  const a = String(arg || '').trim();
  if (LIT.test(a)) return parseLit(a);
  const r = resolve(a, c.prog);
  return r && !r.dim && isAtomic(r.type) ? r.get() : 0;
}
function bit(arg, c){ const r = resolve(arg, c.prog); return r && r.type === 'BOOL' && !r.dim ? r.get() : 0; }
function setb(arg, v, c){ const r = resolve(arg, c.prog); if (r && r.type === 'BOOL' && !r.dim) r.set(v ? 1 : 0); }
function setn(arg, v, c){ const r = resolve(arg, c.prog); if (r && isAtomic(r.type) && !r.dim) r.set(v); }
function struct(arg, c){ const r = resolve(arg, c.prog); const v = r && r.get(); return v && typeof v === 'object' && !Array.isArray(v) ? v : null; }

/* CPT expressions: + - * / MOD ** ( ) ABS SQRT */
function evalExpr(src, c){
  const toks = String(src).match(/\d+\.?\d*(?:[eE][-+]?\d+)?|\.\d+|[A-Za-z_][\w.\[\]]*|\*\*|[-+*/()]|\S/g) || [];
  let i = 0;
  const peek = () => toks[i], take = () => toks[i++];
  function atom(){
    const t = take();
    if (t === undefined) throw 0;
    if (t === '('){ const v = add(); take(); return v; }
    if (/^[\d.]/.test(t)) return Number(t);
    if (peek() === '(' && /^(ABS|SQRT|SQR)$/i.test(t)){ take(); const v = add(); take(); return /ABS/i.test(t) ? Math.abs(v) : Math.sqrt(v); }
    return num(t, c);
  }
  function pow(){ const b = atom(); if (peek() === '**'){ take(); return Math.pow(b, unary()); } return b; }
  function unary(){ if (peek() === '-'){ take(); return -unary(); } if (peek() === '+'){ take(); } return pow(); }
  function mul(){ let v = unary(); for(;;){ const o = peek();
    if (o === '*'){ take(); v *= unary(); } else if (o === '/'){ take(); const d = unary(); v = d ? v / d : 0; }
    else if (o && /^MOD$/i.test(o)){ take(); const d = unary(); v = d ? v % d : 0; } else return v; } }
  function add(){ let v = mul(); for(;;){ const o = peek(); if (o === '+'){ take(); v += mul(); } else if (o === '-'){ take(); v -= mul(); } else return v; } }
  try { return add(); } catch(e){ return 0; }
}

/* ---------------- instruction set ---------------- */
const intDiv = (a, b) => b ? a / b : 0;
const math = f => (a, i, c) => { if (i) setn(a[2], f(num(a[0], c), num(a[1], c)), c); return i; };
const cmp = f => (a, i, c) => i && f(num(a[0], c), num(a[1], c));
const I = {
  XIC:{k:'c', g:'] [', d:'Examine if closed', p:['Bit'], x:(a,i,c) => i && !!bit(a[0],c)},
  XIO:{k:'c', g:']/[', d:'Examine if open', p:['Bit'], x:(a,i,c) => i && !bit(a[0],c)},
  ONS:{k:'c', g:'ONS', d:'One shot', p:['Storage bit'], x:(a,i,c) => { const s = bit(a[0],c); setb(a[0], i, c); return i && !s; }},
  OTE:{k:'o', g:'( )', d:'Output energize', p:['Bit'], x:(a,i,c) => { setb(a[0], i, c); return i; }},
  OTL:{k:'o', g:'(L)', d:'Output latch', p:['Bit'], x:(a,i,c) => { if (i) setb(a[0], 1, c); return i; }},
  OTU:{k:'o', g:'(U)', d:'Output unlatch', p:['Bit'], x:(a,i,c) => { if (i) setb(a[0], 0, c); return i; }},
  RES:{k:'o', g:'(RES)', d:'Reset timer or counter', p:['Structure'], x:(a,i,c) => {
    const t = struct(a[0], c); if (i && t) for (const f of ['ACC','EN','TT','DN','CU','CD','OV','UN']) if (f in t) t[f] = 0; return i; }},
  OSR:{k:'b', g:'OSR', d:'One shot rising', p:['Storage bit','Output bit'], x:(a,i,c) => { const s = bit(a[0],c); setb(a[0], i, c); setb(a[1], i && !s, c); return i; }},
  OSF:{k:'b', g:'OSF', d:'One shot falling', p:['Storage bit','Output bit'], x:(a,i,c) => { const s = bit(a[0],c); setb(a[0], i, c); setb(a[1], !i && s, c); return i; }},
  TON:{k:'b', g:'TON', sa:0, lv:{1:'PRE',2:'ACC'}, d:'Timer on delay', p:['Timer','Preset','Accum'], st:['EN','TT','DN'], x:(a,i,c) => { const t = struct(a[0],c); if (!t) return i;
    if (i){ t.EN = 1; if (t.ACC < t.PRE) t.ACC = Math.min(t.PRE, t.ACC + c.dt); t.DN = t.ACC >= t.PRE ? 1 : 0; t.TT = t.DN ? 0 : 1; }
    else { t.EN = t.TT = t.DN = 0; t.ACC = 0; } return i; }},
  TOF:{k:'b', g:'TOF', sa:0, lv:{1:'PRE',2:'ACC'}, d:'Timer off delay', p:['Timer','Preset','Accum'], st:['EN','TT','DN'], x:(a,i,c) => { const t = struct(a[0],c); if (!t) return i;
    if (i){ t.EN = 1; t.DN = 1; t.TT = 0; t.ACC = 0; }
    else { t.EN = 0; if (t.DN){ t.ACC = Math.min(t.PRE, t.ACC + c.dt); t.TT = 1; if (t.ACC >= t.PRE){ t.DN = 0; t.TT = 0; } } } return i; }},
  RTO:{k:'b', g:'RTO', sa:0, lv:{1:'PRE',2:'ACC'}, d:'Retentive timer on', p:['Timer','Preset','Accum'], st:['EN','TT','DN'], x:(a,i,c) => { const t = struct(a[0],c); if (!t) return i;
    if (i){ t.EN = 1; if (t.ACC < t.PRE) t.ACC = Math.min(t.PRE, t.ACC + c.dt); t.DN = t.ACC >= t.PRE ? 1 : 0; t.TT = t.DN ? 0 : 1; }
    else { t.EN = 0; t.TT = 0; } return i; }},
  CTU:{k:'b', g:'CTU', sa:0, lv:{1:'PRE',2:'ACC'}, d:'Count up', p:['Counter','Preset','Accum'], st:['CU','DN'], x:(a,i,c) => { const t = struct(a[0],c); if (!t) return i;
    if (i && !t.CU) t.ACC = wrap('DINT', t.ACC + 1); t.CU = i ? 1 : 0; t.DN = t.ACC >= t.PRE ? 1 : 0; return i; }},
  CTD:{k:'b', g:'CTD', sa:0, lv:{1:'PRE',2:'ACC'}, d:'Count down', p:['Counter','Preset','Accum'], st:['CD','DN'], x:(a,i,c) => { const t = struct(a[0],c); if (!t) return i;
    if (i && !t.CD) t.ACC = wrap('DINT', t.ACC - 1); t.CD = i ? 1 : 0; t.DN = t.ACC >= t.PRE ? 1 : 0; return i; }},
  EQU:{k:'b', g:'=',  d:'Equal', p:['Source A','Source B'], x:cmp((a,b) => a === b)},
  NEQ:{k:'b', g:'≠',  d:'Not equal', p:['Source A','Source B'], x:cmp((a,b) => a !== b)},
  GRT:{k:'b', g:'>',  d:'Greater than', p:['Source A','Source B'], x:cmp((a,b) => a > b)},
  GEQ:{k:'b', g:'≥',  d:'Greater than or equal', p:['Source A','Source B'], x:cmp((a,b) => a >= b)},
  LES:{k:'b', g:'<',  d:'Less than', p:['Source A','Source B'], x:cmp((a,b) => a < b)},
  LEQ:{k:'b', g:'≤',  d:'Less than or equal', p:['Source A','Source B'], x:cmp((a,b) => a <= b)},
  LIM:{k:'b', g:'LIM', d:'Limit test', p:['Low limit','Test','High limit'], x:(a,i,c) => { const lo = num(a[0],c), t = num(a[1],c), hi = num(a[2],c);
    return i && (lo <= hi ? (t >= lo && t <= hi) : (t >= lo || t <= hi)); }},
  MOV:{k:'b', g:'MOV', d:'Move', p:['Source','Dest'], x:(a,i,c) => { if (i) setn(a[1], num(a[0],c), c); return i; }},
  ADD:{k:'b', g:'+', d:'Add', p:['Source A','Source B','Dest'], x:math((a,b) => a + b)},
  SUB:{k:'b', g:'−', d:'Subtract', p:['Source A','Source B','Dest'], x:math((a,b) => a - b)},
  MUL:{k:'b', g:'×', d:'Multiply', p:['Source A','Source B','Dest'], x:math((a,b) => a * b)},
  DIV:{k:'b', g:'÷', d:'Divide', p:['Source A','Source B','Dest'], x:math(intDiv)},
  MOD:{k:'b', g:'MOD', d:'Modulo', p:['Source A','Source B','Dest'], x:math((a,b) => b ? a % b : 0)},
  CPT:{k:'b', g:'CPT', d:'Compute', p:['Dest','Expression'], x:(a,i,c) => { if (i) setn(a[0], evalExpr(a[1], c), c); return i; }},
  CLR:{k:'b', g:'CLR', d:'Clear', p:['Dest'], x:(a,i,c) => { if (i) setn(a[0], 0, c); return i; }},
  NOP:{k:'b', g:'NOP', d:'No operation', p:[], x:(a,i) => i},
  AFI:{k:'b', g:'AFI', d:'Always false', p:[], x:() => false},
  MEQ:{k:'b', g:'MEQ', d:'Masked equal', p:['Source','Mask','Compare'], x:(a,i,c) => { const m = num(a[1],c); return i && (num(a[0],c) & m) === (num(a[2],c) & m); }},
  COP:{k:'b', g:'COP', d:'Copy file', p:['Source','Dest','Length'], x:(a,i,c) => { if (i) copyFile(a[0], a[1], num(a[2],c), c, false); return i; }},
  FLL:{k:'b', g:'FLL', d:'File fill', p:['Source','Dest','Length'], x:(a,i,c) => { if (i) copyFile(a[0], a[1], num(a[2],c), c, true); return i; }},
  SQO:{k:'b', g:'SQO', d:'Sequencer output', p:['Array','Mask','Dest','Control','Length','Position'], st:['EN','DN','ER'], sa:3, lv:{4:'LEN',5:'POS'}, x:(a,i,c) => {
    const ctl = struct(a[3],c); if (!ctl) return i;
    if (i && !ctl.EN){
      const s = arrAt(a[0], c);
      if (!s || !s.arr || ctl.LEN <= 0){ ctl.ER = 1; }
      else {
        let pos = ctl.POS + 1; if (pos > ctl.LEN || pos < 1) pos = 1;
        ctl.POS = pos; ctl.ER = 0;
        const v = Number(s.arr[s.start + pos]) | 0, m = num(a[1],c) | 0;
        setn(a[2], (num(a[2],c) & ~m) | (v & m), c);
        ctl.DN = pos >= ctl.LEN ? 1 : 0;
      }
    }
    ctl.EN = i ? 1 : 0; return i; }},
  JSR:{k:'b', g:'JSR', d:'Jump to subroutine', p:['Routine','Input count'], va:args => { const k = parseInt(args[1]) || 0; const L = ['Routine','Input count'];
      for (let j = 2; j < args.length; j++) L.push(j < 2 + k ? 'Input ' + (j - 1) : 'Return ' + (j - 1 - k)); return L; },
    x:(a,i,c) => { if (!i || c.dry) return i;
      const rt = c.prog.routines.find(r => lc(r.name) === lc(a[0]));
      if (!rt) throw new Error('JSR: no routine named ' + a[0] + ' in ' + c.prog.name);
      const k = parseInt(a[1]) || 0;
      const rets = runRoutine(rt, c, a.slice(2, 2 + k).map(x => num(x, c)));
      a.slice(2 + k).forEach((x, j) => { if (j < rets.length) setn(x, rets[j], c); });
      return i; }},
  SBR:{k:'b', g:'SBR', d:'Subroutine parameters', p:[], va:args => args.map((_, j) => 'Input ' + (j + 1)),
    x:(a,i,c) => { if (i && c.params) a.forEach((x, j) => { if (j < c.params.length) setn(x, c.params[j], c); }); return i; }},
  RET:{k:'b', g:'RET', d:'Return from subroutine', p:[], va:args => args.map((_, j) => 'Return ' + (j + 1)),
    x:(a,i,c) => { if (i){ c.ret = a.map(x => num(x, c)); c.stop = true; } return i; }},
};
const labelsFor = n => { const d = I[n.name]; return !d ? n.args.map((_, i) => 'Operand ' + (i + 1)) : d.va ? d.va(n.args) : d.p; };
/* array helpers for COP, FLL and SQO: "Arr[3]" starts at element 3, "Arr" at 0, a plain tag is one element */
function arrAt(path, c){
  path = String(path || '').trim();
  const m = /^(.*)\[([^\[\]]+)\]$/.exec(path);

  const sameShape = (a, b) => typeof a === typeof b && Array.isArray(a) === Array.isArray(b) && (!Array.isArray(a) || a.length === b.length);
  function carry(from, to){
    const move = (src, dst) => { for (const t of dst){ const o = src.find(x => x.name === t.name && x.type === t.type && (x.dim || 0) === (t.dim || 0)); if (o && sameShape(o.value, t.value)) t.value = o.value; } };
    move(from.tags, to.tags);
    for (const p of to.programs){ const q = from.programs.find(x => x.name === p.name); if (q) move(q.tags, p.tags); }
  }
  function applyVals(v){
    const put = (list, src) => { if (src) for (const t of list){ if (src[t.name] !== undefined && sameShape(t.value, src[t.name])) t.value = src[t.name]; } };
    put(proj.tags, v.c); for (const p of proj.programs) put(p.tags, v.p && v.p[p.name]);
  }
  function load(json, keep){
    const old = proj, p = typeof json === 'string' ? JSON.parse(json) : json;
    if (keep && old) carry(old, p);
    proj = p;
    const prev = models;
    models = ((proj.io && proj.io.models) || []).map((cfg, k) => {
      const was = prev[k];
      return {cfg, st:was && was.cfg.kind === cfg.kind ? was.st : cfg.kind === 'tank' ? {level:+cfg.start || 0} : {parts:[], count:0, feedT:0, add:0}, view:null};
    });
  }
  const rb = path => { const r = path && K.resolveAny(path); return r && !r.dim && typeof r.get() === 'number' ? r.get() : 0; };
  const wr = (path, v) => { const r = path && K.resolveAny(path); if (r && !r.dim) r.set(v); };
  /* simulated field devices. In Program mode the controller's outputs are off, so motors stop and valves close. */
  function stepModels(dt, outputsOn){
    const s = dt / 1000;
    for (const m of models){
      const c = m.cfg, st = m.st;
      if (c.kind === 'tank'){
        const fill = outputsOn && !!rb(c.fill), drain = outputsOn && !!rb(c.drain);
        st.level = Math.max(0, Math.min(100, st.level + s * ((fill ? +c.fillRate || 10 : 0) - (drain ? +c.drainRate || 8 : 0) - (+c.leak || 0))));
        wr(c.level, st.level); wr(c.hi, st.level >= (+c.hiSP || 90) ? 1 : 0); wr(c.lo, st.level <= (+c.loSP || 10) ? 1 : 0);
        m.view = {kind:'tank', name:c.name, level:st.level, fill, drain, hiSP:+c.hiSP || 90, loSP:+c.loSP || 10};
      } else {
        const run = outputsOn && !!rb(c.motor), PL = 8, sp = +c.speed || 20;
        if (run) for (let k = 0; k < st.parts.length; k++) st.parts[k] += sp * s;
        const n0 = st.parts.length; st.parts = st.parts.filter(p => p - PL < 100); st.count += n0 - st.parts.length;
        const clear = !st.parts.some(p => p < PL + 2);
        if (+c.feed > 0){ st.feedT += s; if (st.feedT >= +c.feed && clear){ st.parts.push(0); st.feedT = 0; } }
        if (st.add){ if (clear) st.parts.push(0); st.add = 0; }
        const e1 = +c.pe1At || 15, e2 = +c.pe2At || 90, eye = e => st.parts.some(p => p >= e && p - PL <= e);
        wr(c.pe1, eye(e1) ? 1 : 0); wr(c.pe2, eye(e2) ? 1 : 0);
        m.view = {kind:'conveyor', name:c.name, parts:st.parts.slice(), count:st.count, run, e1, e2, b1:eye(e1), b2:eye(e2)};
      }
    }
  }
  function status(){ return {op:'status', mode:C.mode, fault:C.fault, scans:C.scans, scanMs:C.scanMs, maxMs:C.maxMs, period:C.period, watchdog:C.watchdog, sig:C.sig, has:!!proj, name:proj ? proj.name : '', engine:typeof WorkerGlobalScope !== 'undefined' ? 'worker' : 'page'}; }
  function values(){
    if (!proj) return;
    const c = {}, p = {};
    for (const t of proj.tags) if (!t.alias) c[t.name] = t.value;
    for (const pr of proj.programs){ const o = p[pr.name] = {}; for (const t of pr.tags) if (!t.alias) o[t.name] = t.value; }
    send({op:'values', c, p, models:models.map(m => m.view), mode:C.mode});
  }
  function fault(e){ C.mode = 'FAULT'; C.fault = String(e && e.message || e); send(status()); }
  function tick(){
    const now = performance.now(), dt = C.last ? Math.min(now - C.last, 1000) : C.period; C.last = now;
    if (proj && C.mode !== 'FAULT'){
      try {
        stepModels(dt, C.mode === 'RUN');
        if (C.mode === 'RUN'){
          const t0 = performance.now();
          K.scanProject(proj, dt, t0 + C.watchdog);
          const ms = performance.now() - t0; C.scanMs = ms; if (ms > C.maxMs) C.maxMs = ms; C.scans++;
          if (ms > C.watchdog) throw new Error('Watchdog: the scan took ' + ms.toFixed(1) + ' ms, the limit is ' + C.watchdog + ' ms');
        }
      } catch(e){ fault(e); }
    }
    if (now - lastV >= 100){ lastV = now; values(); }
    if (now - lastS >= 250){ lastS = now; send(status()); }
  }
  function restart(){ clearInterval(timer); timer = setInterval(tick, C.period); }
  function handle(m){
    const err = msg => send({op:'error', to:m.from, msg});
    switch (m.op){
      case 'hello': send(status()); values(); break;
      case 'download': load(m.project, false); C.sig = m.sig || ''; C.mode = 'PROG'; C.fault = null; C.maxMs = 0; C.scans = 0;
        send({op:'ack', to:m.from, what:'download'}); send(status()); values(); break;
      case 'edit': if (!proj){ err('The controller has no project. Download first.'); break; }
        load(m.project, true); C.sig = m.sig || ''; send({op:'ack', to:m.from, what:'edit'}); send(status()); break;
      case 'restore': load(m.project, false); if (m.values) applyVals(m.values); C.sig = m.sig || '';
        C.fault = m.fault || null; C.mode = C.fault ? 'FAULT' : m.mode === 'RUN' ? 'RUN' : 'PROG'; send(status()); values(); break;
      case 'upload': send({op:'upload', to:m.from, project:proj ? JSON.stringify(proj, strip) : null, sig:C.sig}); break;
      case 'mode':
        if (!proj){ err('The controller has no project yet. Download one first.'); break; }
        if (C.mode === 'FAULT' && m.mode === 'RUN'){ err('Clear the fault before switching to Run.'); break; }
        C.mode = m.mode === 'RUN' ? 'RUN' : 'PROG'; if (C.mode === 'RUN') C.maxMs = 0; send(status()); break;
      case 'clearFault': C.fault = null; if (C.mode === 'FAULT') C.mode = 'PROG'; send(status()); break;
      case 'write': {
        const r = K.resolveAny(m.path);
        if (!r || r.dim || typeof r.get() !== 'number'){ err('The controller has no tag named ' + m.path + '.'); break; }
        r.set(m.toggle ? (r.get() ? 0 : 1) : Number(m.value)); values(); break;
      }
      case 'model': { const x = models[m.idx]; if (!x) break;
        if (m.action === 'addPart') x.st.add = 1;
        if (m.action === 'reset'){ if (x.cfg.kind === 'tank') x.st.level = +x.cfg.start || 0; else { x.st.parts = []; x.st.count = 0; } }
        break; }
      case 'config':
        if (m.period >= 1 && m.period <= 1000) C.period = Math.round(m.period);
        if (m.watchdog >= 5 && m.watchdog <= 5000) C.watchdog = Math.round(m.watchdog);
        restart(); send(status()); break;
      case 'wipe': proj = null; models = []; C.sig = ''; C.mode = 'PROG'; C.fault = null; send(status()); break;
    }
  }
  port.onmessage = e => { const m = e.data || {}; try { handle(m); } catch(x){ send({op:'error', to:m.from, msg:String(x && x.message || x)}); } };
  restart();
  send({op:'ready'});
}

/* ---------------- connection: this tab hosts the controller, or reaches the one another tab hosts ---------------- */
const CONN = {tab:Math.random().toString(36).slice(2, 10), host:false, port:null, bc:null, plc:null, seen:0, online:false, engine:'', last:null, wait:null};
const PKEY = 'openrung.plc.v1';
let plcMem = null, plcSavedAt = 0;
const clone = v => typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function startPLC(){
  return new Promise(res => {
    let done = false;
    const inPage = () => { if (done) return; done = true; const mc = new MessageChannel(); PLCMAIN(mc.port1, CORE); res(mc.port2); };
    try {
      const src = '"use strict";\nconst CORE = ' + CORE.toString() + ';\n(' + PLCMAIN.toString() + ')(self, CORE);';
      const w = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
      const t = setTimeout(() => { w.terminate(); inPage(); }, 2000);
      w.onerror = () => { clearTimeout(t); w.terminate(); inPage(); };
      w.onmessage = e => { if (!done && e.data && e.data.op === 'ready'){ clearTimeout(t); done = true; w.onerror = null; res(w); } };
    } catch(e){ inPage(); }
  });
}
/* the host tab keeps a copy of the controller's memory, so a reload powers it back up with the same program and values */
function hostOut(m){
  if (m.op === 'download' || m.op === 'edit') plcMem = {project:m.project, sig:m.sig, mode:m.op === 'download' ? 'PROG' : (plcMem && plcMem.mode) || 'PROG', values:null, fault:null};
  if (m.op === 'wipe'){ plcMem = null; try { localStorage.removeItem(PKEY); } catch(e){} }
  if (m.op === 'download' || m.op === 'edit') persistPLC(true);
}
function hostIn(m){
  if (!plcMem) return;
  if (m.op === 'status' && (plcMem.mode !== m.mode || plcMem.fault !== m.fault)){ plcMem.mode = m.mode; plcMem.fault = m.fault; persistPLC(true); }
  if (m.op === 'values'){ plcMem.values = {c:m.c, p:m.p}; persistPLC(false); }
}
function persistPLC(now){
  if (!now && performance.now() - plcSavedAt < 5000) return;
  plcSavedAt = performance.now();
  try { localStorage.setItem(PKEY, JSON.stringify(plcMem)); } catch(e){}
}
async function becomeHost(){
  if (CONN.host) return;
  CONN.host = true;
  const port = await startPLC();
  CONN.port = port; CONN.engine = port instanceof MessagePort ? 'page' : 'worker';
  port.onmessage = e => { const m = e.data; if (!m || m.op === 'ready') return; hostIn(m); fromPLC(m); if (CONN.bc) try { CONN.bc.postMessage({k:'res', msg:m}); } catch(x){} };
  let saved = null; try { saved = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch(e){}
  if (saved && saved.project){ plcMem = saved; port.postMessage({op:'restore', ...saved, from:CONN.tab}); }
  else port.postMessage({op:'hello', from:CONN.tab});
}
function startConn(){
  try {
    CONN.bc = new BroadcastChannel('openrung-plc');
    CONN.bc.onmessage = e => { const d = e.data || {};
      if (d.k === 'req' && CONN.host && CONN.port){ hostOut(d.msg); CONN.port.postMessage(d.msg); }
      else if (d.k === 'res' && !CONN.host) fromPLC(d.msg); };
  } catch(e){ CONN.bc = null; }
  if (CONN.bc && navigator.locks && navigator.locks.request){
    /* one tab holds the lock and runs the controller; when it closes, the next tab takes over */
    navigator.locks.request('openrung-plc-host', () => { becomeHost(); return new Promise(() => {}); }).catch(() => becomeHost());
    setTimeout(() => { if (!CONN.host) toPLC({op:'hello'}); }, 300);
  } else becomeHost();
}
function toPLC(msg){
  msg.from = CONN.tab;
  if (CONN.host && CONN.port){ hostOut(msg); CONN.port.postMessage(msg); }
  else if (CONN.bc) CONN.bc.postMessage({k:'req', msg});
}
function ask(msg, op, ms){
  return new Promise((res, rej) => {
    if (CONN.wait) CONN.wait.rej(new Error('Another request is still running.'));
    const t = setTimeout(() => { CONN.wait = null; rej(new Error('The controller did not answer.')); }, ms || 4000);
    CONN.wait = {op, res:v => { clearTimeout(t); CONN.wait = null; res(v); }, rej:e => { clearTimeout(t); CONN.wait = null; rej(e); }};
    toPLC(msg);
  });
}
function fromPLC(m){
  if (!m || (m.to && m.to !== CONN.tab)) return;
  CONN.seen = performance.now();
  switch (m.op){
    case 'status': { if (m.engine && CONN.host) CONN.engine = m.engine; const was = CONN.plc; CONN.plc = m;
      if (CONN.online && was && was.mode !== m.mode && m.mode === 'FAULT') toast('The controller faulted: ' + m.fault);
      renderCtl(); renderStatus(); break; }
    case 'values': CONN.last = m; if (CONN.online) onValues(m); break;
    case 'error': if (CONN.wait) CONN.wait.rej(new Error(m.msg)); else toast(m.msg); break;
    case 'ack': case 'upload': if (CONN.wait && CONN.wait.op === m.op) CONN.wait.res(m); break;
  }
}
setInterval(() => {
  if (CONN.online && performance.now() - CONN.seen > 3000){ setOnline(false); toast('Lost the connection to the controller. It may have closed with another tab; go online again to reconnect.'); CONN.plc = null; renderCtl(); }
}, 1000);

/* values from the controller replace the editor's copy; a side-effect-free pass over the visible routine lights the wires */
const sameShape = (a, b) => typeof a === typeof b && Array.isArray(a) === Array.isArray(b) && (!Array.isArray(a) || a.length === b.length);
function applyValues(m){
  const put = (list, src) => { if (src) for (const t of list){ if (t.alias) continue; const v = src[t.name]; if (v !== undefined && sameShape(t.value, v)) t.value = v; } };
  put(P.tags, m.c); for (const pr of P.programs) put(pr.tags, m.p && m.p[pr.name]);
}
let MODELS = [];
function onValues(m){
  const rt = state.view.kind === 'routine' && curRoutine();
  if (rt && rt.type === 'RLL'){
    applyValues(clone(m));
    const c = {prog:curProg(), dt:0, dry:true, depth:1};
    try { for (const r of rt.rungs){ ensureAst(r); if (r.ast) evalSeries(r.ast, true, c); } } catch(e){}
  }
  applyValues(m); MODELS = m.models || [];
  hmiTick(); refreshLive();
}
const scoped = (path, prog) => prog ? `Program:${prog.name}.${path}` : path;
function writeTag(path, value, toggle){
  if (CONN.online) toPLC({op:'write', path, value, toggle:!!toggle});
  const r = resolveAny(path);
  if (r && !r.dim && typeof r.get() === 'number') r.set(toggle ? (r.get() ? 0 : 1) : value);
  if (!CONN.online) save();
}

/* project signature: logic, tags and I/O, without values, comments or HMI screens */
const fnv = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); };
let sigMemo = null;
function projSig(){
  if (sigMemo) return sigMemo;
  const ts = t => [t.name, t.type, t.dim || 0, t.alias || ''];
  return sigMemo = fnv(JSON.stringify({u:P.udts, t:P.tags.map(ts), io:P.io,
    p:P.programs.map(pr => ({n:pr.name, m:pr.main || '', t:pr.tags.map(ts), r:pr.routines.map(r => [r.name, r.type, r.type === 'ST' ? r.st : (r.rungs || []).map(g => g.text)])}))}));
}
function setOnline(on){
  CONN.online = on;
  if (on && CONN.last) onValues(CONN.last);
  renderAll();
}
async function goOnline(){
  if (CONN.online) return true;
  if (!CONN.plc){ toPLC({op:'hello'}); await sleep(500); }
  const s = CONN.plc;
  if (!s){ toast('The virtual controller is not answering. Reload the page to restart it.'); return false; }
  if (s.has && s.sig === projSig()){ setOnline(true); toast('Online with the virtual controller.'); return true; }
  return new Promise(res => {
    const empty = !s.has;
    openModal(`<h2>Go online</h2>
      <p>${empty ? 'The virtual controller has no project yet. Download <b>' + esc(P.name) + '</b> to it?' : 'The controller holds <b>' + esc(s.name) + '</b>, which is different from the project open here.'}</p>
      ${empty ? '' : '<p class="note">Download replaces the program in the controller and puts it in Program mode. Upload replaces the project open here with the one in the controller.</p>'}
      <div class="btns"><button class="primary" id="goDl">Download</button>${empty ? '' : '<button id="goUl">Upload</button>'}<button id="goNo">Cancel</button></div><p class="errmsg" id="goErr"></p>`);
    $('#goNo').onclick = () => { closeModal(); res(false); };
    $('#goDl').onclick = async () => { try { await download(); closeModal(); setOnline(true); toast('Downloaded. Switch the controller to Run to start the scan.'); res(true); } catch(e){ $('#goErr').textContent = e.message; } };
    if (!empty) $('#goUl').onclick = async () => { try { await upload(); closeModal(); setOnline(true); toast('Uploaded the project from the controller.'); res(true); } catch(e){ $('#goErr').textContent = e.message; } };
  });
}
async function download(){
  const wasRun = CONN.plc && CONN.plc.mode === 'RUN';
  await ask({op:'download', project:snapshot(), sig:projSig()}, 'ack');
  if (wasRun) toPLC({op:'mode', mode:'RUN'});
}
async function upload(){
  const m = await ask({op:'upload'}, 'upload');
  if (!m.project) throw new Error('The controller has no project to upload.');
  pushUndo(); P = normalize(JSON.parse(m.project)); reparseAll(); state.sel = null; fixView(); save(); renderAll();
}
async function applyEdits(){
  try { await ask({op:'edit', project:snapshot(), sig:projSig()}, 'ack'); toast('Edits sent. The controller kept running with its current tag values.'); }
  catch(e){ toast(e.message); }
}


/* ---------------- ladder layout + drawing ---------------- */
const G = {cw:96, rowH:72, wy:34, bp:16, boxW:214, argH:18, ph:52};
function sizeNode(n){
  if (n.t === 'br'){
    let w = 0, h = 0;
    for (const l of n.legs){ const s = sizeSeries(l); l._w = s.w; l._h = s.h; w = Math.max(w, s.w); h += s.h; }
    n._w = w + 2 * G.bp; n._h = h; return;
  }
  const d = I[n.name];
  if (!d || d.k === 'b'){
    const rows = labelsFor(n).length;
    n._w = G.boxW; n._h = Math.max(G.rowH, 40 + rows * G.argH + 16);
  } else { n._w = Math.max(G.cw, Math.min(220, String(n.args[0] || '').length * 7 + 24)); n._h = G.rowH; }
}
function sizeSeries(ser){
  if (!ser.length) return {w:G.ph, h:G.rowH};
  let w = 0, h = 0;
  for (const n of ser){ sizeNode(n); w += n._w; h = Math.max(h, n._h); }
  return {w, h};
}
let REG = [];
const reg = o => (REG.push(o), REG.length - 1);
const pw = v => CONN.online && v ? ' p' : '';
const wire = (x1, y1, x2, y2, v) => `<line class="w${pw(v)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const short = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
function isSel(ser, idx){ const s = state.sel; return s && s.ser === ser && s.idx === idx; }

function drawSeries(ser, x, y, ctx, out){
  const wy = y + G.wy;
  if (!ser.length){
    const id = reg({...ctx, ser, idx:-1});
    out.push(wire(x, wy, x + G.ph, wy, ser._out));
    out.push(`<g class="${isSel(ser, -1) ? 'sel' : ''}" data-id="${id}"><rect class="ph" x="${x + 12}" y="${wy - 11}" width="${G.ph - 24}" height="22" rx="4"/><text class="pht" x="${x + G.ph / 2}" y="${wy + 4}" text-anchor="middle">+</text></g>`);
    return x + G.ph;
  }
  ser.forEach((n, idx) => {
    if (n.t === 'br') drawBranch(n, x, y, {...ctx, ser, idx}, out);
    else drawIns(n, x, y, reg({...ctx, ser, idx, node:n}), isSel(ser, idx), ctx.prog, out);
    x += n._w;
  });
  return x;
}
function drawBranch(n, x, y, pos, out){
  const lx = x + 5, rx = x + n._w - 5;
  let yy = y, lastWy = y + G.wy;
  n.legs.forEach((leg, li) => {
    const wy = yy + G.wy; lastWy = wy;
    out.push(wire(lx, wy, x + G.bp, wy, n._in));
    const ex = drawSeries(leg, x + G.bp, yy, {ri:pos.ri, prog:pos.prog, br:n, brSer:pos.ser, brIdx:pos.idx, leg:li}, out);
    out.push(wire(ex, wy, rx, wy, leg._out));
    yy += leg._h;
  });
  out.push(wire(x, y + G.wy, lx, y + G.wy, n._in));
  out.push(wire(lx, y + G.wy, lx, lastWy, n._in));
  out.push(wire(rx, y + G.wy, rx, lastWy, n._out));
  out.push(wire(rx, y + G.wy, x + n._w, y + G.wy, n._out));
}
function opText(arg, prog, x, y, anchor, max, isRt){
  const a = arg == null ? '' : String(arg);
  const bad = a && a !== '?' && !LIT.test(a) && (isRt ? !prog.routines.some(r => lc(r.name) === lc(a)) : !resolve(a, prog));
  return `<text class="op${bad ? ' bad' : ''}" x="${x}" y="${y}" text-anchor="${anchor}"><title>${esc(a)}${bad ? ' (tag not found)' : ''}</title>${esc(short(a || '?', max))}</text>`;
}
function fmtVal(v){
  if (typeof v !== 'number') return '';
  return Number.isInteger(v) ? String(v) : String(Math.round(v * 1000) / 1000);
}
function drawIns(n, x, y, id, sel, prog, out){
  const d = I[n.name], w = n._w, h = n._h, wy = y + G.wy, cx = x + w / 2;
  const c = {prog};
  out.push(`<g class="ins${sel ? ' sel' : ''}" data-id="${id}"><rect class="hit" x="${x + 2}" y="${y + 2}" width="${w - 4}" height="${h - 4}" rx="5"/>`);
  if (d && d.k === 'c'){
    const b = bit(n.args[0], c);
    const on = n.name === 'XIO' ? !b : !!b;
    out.push(wire(x, wy, cx - 9, wy, n._in), wire(cx + 9, wy, x + w, wy, n._out));
    out.push(`<rect class="cf${on && n.name !== 'ONS' ? ' on' : ''}" x="${cx - 8}" y="${wy - 12}" width="16" height="24"/>`);
    out.push(`<line class="sym" x1="${cx - 9}" y1="${wy - 13}" x2="${cx - 9}" y2="${wy + 13}"/><line class="sym" x1="${cx + 9}" y1="${wy - 13}" x2="${cx + 9}" y2="${wy + 13}"/>`);
    if (n.name === 'XIO') out.push(`<line class="sym" x1="${cx - 6}" y1="${wy + 11}" x2="${cx + 6}" y2="${wy - 11}"/>`);
    if (n.name === 'ONS') out.push(`<text class="tiny" x="${cx}" y="${wy + 26}" text-anchor="middle">ONS</text>`);
    out.push(opText(n.args[0], prog, cx, y + 14, 'middle', 30));
  } else if (d && d.k === 'o'){
    const lbl = {OTL:'L', OTU:'U', RES:'RES'}[n.name] || '';
    const r = lbl.length > 1 ? 16 : 11;
    const on = n.name === 'RES' ? (CONN.online && n._in) : !!bit(n.args[0], c);
    out.push(wire(x, wy, cx - r, wy, n._in), wire(cx + r, wy, x + w, wy, n._out));
    out.push(`<path class="sym" d="M${cx - r + 5} ${wy - 12} Q${cx - r - 3} ${wy} ${cx - r + 5} ${wy + 12}"/><path class="sym" d="M${cx + r - 5} ${wy - 12} Q${cx + r + 3} ${wy} ${cx + r - 5} ${wy + 12}"/>`);
    if (on) out.push(`<circle cx="${cx}" cy="${wy}" r="${r - 6}" class="cf on"/>`);
    if (lbl) out.push(`<text class="coilt${on ? ' on' : ''}" x="${cx}" y="${wy + 4}" text-anchor="middle" style="${on ? 'fill:#fff' : ''}">${lbl}</text>`);
    out.push(opText(n.args[0], prog, cx, y + 14, 'middle', 30));
  } else {
    const bx = x + 8, bw = w - 16, by = y + 12, bh = h - 20;
    out.push(wire(x, wy, bx, wy, n._in), wire(bx + bw, wy, x + w, wy, n._out));
    out.push(`<rect class="box${CONN.online && n._out ? ' on' : ''}" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="3"/>`);
    out.push(`<text class="bt${d ? '' : ' unk'}" x="${bx + 8}" y="${by + 16}">${esc(n.name)}</text>`);
    if (!d) out.push(`<text class="bl" x="${bx + 8}" y="${by + 30}">not simulated, passes power</text>`);
    const t = d && d.st ? struct(n.args[d.sa || 0], c) : null;
    if (d && d.st){
      let sx = bx + bw - 8;
      for (const f of [...d.st].reverse()){
        const on = t && t[f];
        out.push(`<text class="tiny${on ? ' on' : ''}" x="${sx}" y="${by + 15}" text-anchor="end">${f}</text>`);
        sx -= f.length * 6 + 8;
      }
    }
    const labels = labelsFor(n);
    labels.forEach((lab, i) => {
      const ry = by + (d ? 38 : 48) + i * G.argH;
      const a = n.args[i] == null ? '?' : n.args[i];
      out.push(`<text class="bl" x="${bx + 8}" y="${ry}">${esc(lab)}</text>`);
      if (t && d.lv && d.lv[i]){
        out.push(`<text class="op" x="${bx + bw - 8}" y="${ry}" text-anchor="end">${Math.floor(t[d.lv[i]])}</text>`);
      } else if (n.name === 'JSR' && i === 0){
        out.push(opText(a, prog, bx + bw - 8, ry, 'end', 18, true));
      } else if (n.name === 'CPT' && i === 1){
        out.push(opText(a, prog, bx + bw - 8, ry, 'end', 22));

        const r = !LIT.test(a) && resolve(a, prog);

        if (v !== null){
          out.push(`<text class="bv" x="${bx + bw - 8}" y="${ry}" text-anchor="end">${esc(fmtVal(v))}</text>`);
          out.push(opText(a, prog, bx + bw - 14 - fmtVal(v).length * 6, ry, 'end', 14));
        } else out.push(opText(a, prog, bx + bw - 8, ry, 'end', 18));
      }
    });
  }

}
function rungSVG(rung, ri, prog, minW){
  const s = sizeSeries(rung.ast);

  out.push(`<line class="rail" x1="3" y1="0" x2="3" y2="${H}"/><line class="rail" x1="${W - 3}" y1="0" x2="${W - 3}" y2="${H}"/>`);
  out.push(wire(3, G.wy, 14, G.wy, true));
  const ex = drawSeries(rung.ast, 14, 0, {ri, prog, br:null}, out);
  out.push(wire(ex, G.wy, W - 3, G.wy, rung.ast._out));

}

/* ---------------- accounts and online projects (Supabase) ----------------
   Fill in CLOUD_CFG with your Supabase project URL and anon key, or enter them in the Account dialog.
   The anon key is public by design; row-level security (see supabase/setup.sql) keeps each user's projects private.
   Without a configuration the app works exactly as before, saving only in this browser. */
const CLOUD_CFG = {url:'', key:''};
const CLOUD = {
  sb:null, user:null, err:'', savedAt:null, timer:0, lastSent:'',
  cfg(){ let c = null; try { c = JSON.parse(localStorage.getItem('openrung.cloud.v1') || 'null'); } catch(e){} return c && c.url && c.key ? c : CLOUD_CFG; },
  ready(){ const c = this.cfg(); return !!(c.url && c.key); },
  async lib(){
    if (window.supabase) return window.supabase;
    await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; s.onload = ok; s.onerror = () => bad(new Error('Could not load the sign-in library. Check your internet connection.')); document.head.appendChild(s); });
    return window.supabase;
  },
  async init(){
    if (!this.ready()){ this.renderBtn(); return; }
    try {
      const c = this.cfg(), lib = await this.lib();
      this.sb = lib.createClient(c.url, c.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
      const {data} = await this.sb.auth.getSession(); this.setUser(data.session && data.session.user);
      this.sb.auth.onAuthStateChange((ev, sess) => { this.setUser(sess && sess.user); if (ev === 'PASSWORD_RECOVERY') setTimeout(() => showAccount('Choose a new password below.'), 0); });
    } catch(e){ this.err = e.message; }
    this.renderBtn();
  },
  setUser(u){ const was = this.user && this.user.id; this.user = u || null; this.err = ''; this.renderBtn(); renderStatus(); if (this.user && this.user.id !== was){ this.lastSent = ''; this.queue(); } },
  renderBtn(){ const b = $('#acctBtn'); if (b) b.textContent = this.user ? (this.user.email || 'Account').split('@')[0] : 'Sign in'; },
  need(){ if (!this.sb || !this.user) throw new Error('Sign in first.'); },
  queue(){ if (!this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push().catch(() => {}), 2000); },
  async push(){
    this.need(); const snap = snapshot(); if (snap === this.lastSent) return;
    const {error} = await this.sb.from('projects').upsert({user_id:this.user.id, name:P.name, data:JSON.parse(snap), updated_at:new Date().toISOString()}, {onConflict:'user_id,name'});

    this.lastSent = snap; this.err = ''; this.savedAt = new Date(); renderStatus();
  },
  async list(){ this.need(); const {data, error} = await this.sb.from('projects').select('name,updated_at').order('updated_at', {ascending:false}); if (error) throw new Error(error.message); return data; },
  async get(name){ this.need(); const {data, error} = await this.sb.from('projects').select('data').eq('name', name).single(); if (error) throw new Error(error.message); if (!data || !data.data || !Array.isArray(data.data.programs)) throw new Error('That project could not be read.'); return data.data; },
  async del(name){ this.need(); const {error} = await this.sb.from('projects').delete().eq('name', name); if (error) throw new Error(error.message); }
};

/* autosave: the open project, plus a copy under its name for the recent-projects list */
const RKEY = 'openrung.recent.v1', PFX = 'openrung.p.';
let saveTimer = 0, savedAt = null;
function save(now){

  const write = () => {
    try {
      const snap = snapshot();
      localStorage.setItem(KEY, snap); localStorage.setItem(PFX + P.name, snap);
      const list = recentList().filter(r => r.name !== P.name); list.unshift({name:P.name, at:Date.now()});
      localStorage.setItem(RKEY, JSON.stringify(list.slice(0, 12)));

function recentList(){ try { const l = JSON.parse(localStorage.getItem(RKEY) || '[]'); return Array.isArray(l) ? l : []; } catch(e){ return []; } }

function normalize(p){

  if (!Array.isArray(p.io.models)) p.io.models = [];
  for (const pr of p.programs) for (const r of pr.routines){ if (r.type === 'ST' && r.st == null) r.st = ''; if (!r.rungs) r.rungs = []; }

/* ---------------- ladder editing ---------------- */
function commitRung(rung){ rung.text = serialize(rung.ast) + ';'; rung.err = null; }
function selRung(){
  const rt = curRoutine(); if (!rt) return null;
  if (state.sel) return rt.rungs[state.sel.ri];
  return null;
}
function insertIns(name){
  const rt = curRoutine(); if (!rt || rt.type !== 'RLL') return;
  const d = I[name]; const node = {t:'i', name, args:d.p.map(() => '?')};
  edit(() => {
    if (!rt.rungs.length) rt.rungs.push({comment:'', text:';'});
    let s = state.sel;
    if (!s){ s = {ri:rt.rungs.length - 1, kind:'rung'}; }
    const rung = rt.rungs[s.ri]; ensureAst(rung);
    if (!rung.ast){ toast('Fix the rung text first.'); return; }
    let ser, at;
    if (s.kind === 'rung' || !s.ser){ ser = rung.ast; at = ser.length; }
    else { ser = s.ser; at = s.idx + 1; }
    ser.splice(at, 0, node);
    commitRung(rung);
    state.sel = {kind:'node', ri:s.ri, ser, idx:at, br:s.br, brSer:s.brSer, brIdx:s.brIdx, leg:s.leg};
  });
  renderLadder(); renderInspector(); focusOperand();
}
function focusOperand(){ const f = $('#op-0'); if (f){ f.focus(); f.select(); } }
function addBranch(){
  const rt = curRoutine(); if (!rt) return;
  const s = state.sel;
  if (!s){ toast('Select an instruction or a rung first.'); return; }
  const rung = rt.rungs[s.ri]; ensureAst(rung); if (!rung.ast) return;
  edit(() => {
    let br;
    if (s.kind === 'node' && s.idx >= 0){ br = {t:'br', legs:[[s.ser[s.idx]], []]}; s.ser[s.idx] = br; }
    else if (s.kind === 'node' && s.idx === -1){ br = {t:'br', legs:[[], []]}; s.ser.push(br); }
    else { br = {t:'br', legs:[[], []]}; rung.ast.push(br); }
    commitRung(rung);
    state.sel = {kind:'node', ri:s.ri, ser:br.legs[1], idx:-1, br};
  });
  renderLadder(); renderInspector();
}
function addLeg(){
  const s = state.sel, rt = curRoutine();
  if (!s || !s.br){ toast('Select something inside a branch first.'); return; }
  const rung = rt.rungs[s.ri];
  edit(() => { const leg = []; s.br.legs.push(leg); commitRung(rung); state.sel = {kind:'node', ri:s.ri, ser:leg, idx:-1, br:s.br}; });
  renderLadder(); renderInspector();
}
function addRung(after){
  const rt = curRoutine(); if (!rt || rt.type !== 'RLL') return;
  const at = after != null ? after + 1 : state.sel ? state.sel.ri + 1 : rt.rungs.length;
  edit(() => rt.rungs.splice(at, 0, {comment:'', text:';'}));

function deleteSel(){
  const s = state.sel, rt = curRoutine(); if (!s || !rt) return;
  const rung = rt.rungs[s.ri];
  if (s.kind === 'rung'){ edit(() => rt.rungs.splice(s.ri, 1)); state.sel = null; renderAll(); return; }
  edit(() => {
    if (s.idx >= 0) s.ser.splice(s.idx, 1);
    else if (s.br){ const li = s.br.legs.indexOf(s.ser); if (li >= 0) s.br.legs.splice(li, 1); }
    tidy(rung.ast);
    commitRung(rung);
  });
  state.sel = {kind:'rung', ri:s.ri};
  renderLadder(); renderInspector();
}
/* collapse branches left with one leg, drop branches with none */
function tidy(ser){
  for (let i = 0; i < ser.length; i++){
    const n = ser[i]; if (n.t !== 'br') continue;
    n.legs.forEach(tidy);
    if (n.legs.length === 0){ ser.splice(i, 1); i--; }
    else if (n.legs.length === 1){ ser.splice(i, 1, ...n.legs[0]); i--; }
  }
}
function moveRung(d){
  const s = state.sel, rt = curRoutine(); if (!s) return;
  const j = s.ri + d; if (j < 0 || j >= rt.rungs.length) return;
  edit(() => { const [r] = rt.rungs.splice(s.ri, 1); rt.rungs.splice(j, 0, r); });
  state.sel = {kind:'rung', ri:j}; renderLadder(); renderInspector();
}

/* ---------------- rendering: ladder view ---------------- */

  if (rt.type === 'ST'){

    h += `<div class="stwrap"><textarea id="stsrc" class="stsrc" spellcheck="false" rows="${Math.max(14, (rt.st || '').split('\n').length + 3)}" aria-label="Structured text">${esc(rt.st || '')}</textarea>
      <div class="errmsg" id="sterr">${a.err ? esc(a.err) : ''}</div>

}
let lastTap = {id:null, t:0};

function stApply(){

function stRefs(src){
  const clean = String(src || '').replace(/\(\*[\s\S]*?\*\)|\/\*[\s\S]*?\*\/|\/\/.*$/gm, ' ');
  const out = new Set();
  for (const m of clean.matchAll(/[A-Za-z_]\w*(?:\[\d+\]|\.\w+)*/g)){
    const w = m[0], head = w.split(/[.\[]/)[0].toUpperCase();
    if (!['IF','THEN','ELSIF','ELSE','END_IF','CASE','OF','END_CASE','FOR','TO','BY','DO','END_FOR','WHILE','END_WHILE','REPEAT','UNTIL','END_REPEAT','EXIT','RETURN','AND','OR','XOR','NOT','MOD','TRUE','FALSE','JSR','SBR','RET','ABS','SQRT','MIN','MAX','TRUNC','SIN','COS','TAN','LN','LOG','EXP'].includes(head)) out.add(w);
    if (out.size > 40) break;
  }
  return [...out];
}
function renderWatch(rt, prog){
  const box = $('#stwatch'); if (!box) return;
  const refs = stRefs(rt.st).filter(w => { const r = resolve(w, prog); return r && !r.dim && typeof r.get() === 'number'; });
  if (!refs.length){ box.innerHTML = '<p class="note">Tags used in the code show up here with their values.</p>'; return; }
  box.innerHTML = refs.map(w => { const r = resolve(w, prog), v = r.get();
    return `<div class="wrow"><span class="mono">${esc(w)}</span><b class="mono${r.type === 'BOOL' && v ? ' t' : ''}">${esc(fmtVal(v))}</b></div>`; }).join('');
}
function toggleOperand(node, prog){
  const d = I[node.name]; if (!d || d.k === 'b') return;
  const r = resolve(node.args[0], prog);
  if (r && r.type === 'BOOL'){ writeTag(scoped(node.args[0], prog.tags.some(t => lc(t.name) === lc(String(node.args[0]).split(/[.\[]/)[0])) ? prog : null), 0, true); refreshLive(); }
}

/* ---------------- inspector ---------------- */
function tagPaths(prog){
  const out = [];
  const add = (p, type, dim, depth) => {
    if (out.length > 3000 || depth > 4) return;
    if (dim > 0){ for (let i = 0; i < Math.min(dim, 16); i++) add(`${p}[${i}]`, type, 0, depth + 1); return; }
    out.push(p);
    const ms = !isAtomic(type) && membersOf(type);
    if (ms) for (const m of ms) add(p + '.' + m.name, m.type, m.dim || 0, depth + 1);
  };
  for (const t of [...(prog ? prog.tags : []), ...P.tags]) add(t.name, t.type, t.dim || 0, 0);
  return out;
}
function liveHTML(arg, prog, isRt){
  const a = String(arg || '').trim();
  if (!a || a === '?') return '<span>No operand yet</span>';
  if (isRt) return prog.routines.some(r => lc(r.name) === lc(a)) ? '<span>Routine found</span>' : `<span class="errmsg">No routine named ${esc(a)} in ${esc(prog.name)}.</span>`;
  if (LIT.test(a)) return `<span>Constant</span><b>${esc(a)}</b>`;
  const r = resolve(a, prog);
  if (!r) return `<span class="errmsg">No tag named ${esc(a)}. Add it under Tags.</span>`;
  if (r.dim) return `<span>${esc(r.type)}[${r.dim}]</span>`;
  const v = r.get();
  if (r.type === 'BOOL') return `<span>BOOL</span><b class="${v ? 't' : ''}">${v}</b>`;
  if (isAtomic(r.type)) return `<span>${r.type}</span><b>${esc(fmtVal(v))}</b>`;
  if (v && 'PRE' in v) return `<span>${esc(r.type)}</span><b>PRE ${Math.floor(v.PRE)} · ACC ${Math.floor(v.ACC)} · DN ${v.DN}</b>`;
  if (v && 'POS' in v) return `<span>${esc(r.type)}</span><b>LEN ${v.LEN} · POS ${v.POS} · DN ${v.DN}</b>`;
  return `<span>${esc(r.type)}</span>`;
}

const TYPES = () => ['BOOL','SINT','INT','DINT','REAL','TIMER','COUNTER','CONTROL', ...P.udts.map(u => u.name)];
function renderTags(){
  const scope = state.view.scope;

    <div class="field"><label for="nt-desc">Description</label><input id="nt-desc" placeholder="Optional"></div>
    <button class="primary">Add tag</button></form>`;

function tagRows(label, path, type, dim, depth, tag, ti, prog){
  const key = (prog ? prog.name : '') + '/' + path;
  const intBits = isAtomic(type) && !dim && type !== 'BOOL' && type !== 'REAL';
  const kids = dim > 0 || (!isAtomic(type) && membersOf(type)) || intBits;
  const open = state.expanded.has(key);
  const pad = `padding-left:${8 + depth * 18}px`;
  let val = '';
  if (tag && tag.alias) val = `<span class="muted mono">alias for ${esc(tag.alias)}</span>`;
  else if (dim > 0 || !isAtomic(type)) val = `<span class="muted mono">{…}</span>`;
  else if (type === 'BOOL') val = `<button class="bitbtn" data-set="${esc(path)}">0</button>`;
  else val = `<input class="num" data-path="${esc(path)}" aria-label="Value of ${esc(path)}">`;
  let h = `<tr><td class="nm" style="${pad}">${kids && !(tag && tag.alias) ? `<button class="exp" data-exp="${esc(key)}" aria-label="Expand">${open ? '▾' : '▸'}</button>` : '<span class="exp" style="display:inline-block"></span>'}${esc(label)}</td><td>${val}</td>`;
  if (tag){
    h += `<td><select data-tf="type" data-ti="${ti}">${TYPES().concat(TYPES().includes(tag.type) ? [] : [tag.type]).map(t => `<option${t === tag.type ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>${tag.dim ? `<span class="mono muted"> [${tag.dim}]</span>` : ''}</td>
      <td><input data-tf="desc" data-ti="${ti}" value="${esc(tag.description || '')}" aria-label="Description of ${esc(tag.name)}"></td>
      <td><button class="danger" data-deltag="${ti}" title="Delete tag" aria-label="Delete ${esc(tag.name)}">×</button></td></tr>`;
  } else h += `<td class="mono muted">${esc(type)}${dim ? `[${dim}]` : ''}</td><td></td><td></td></tr>`;
  if (open && !(tag && tag.alias)){
    if (dim > 0){ for (let i = 0; i < dim && i < 200; i++) h += tagRows(`${label}[${i}]`, `${path}[${i}]`, type, 0, depth + 1, null, -1, prog); }
    else if (intBits){
      const n = ATOMIC[type];

  seen = seen || new Set(); if (seen.has(u.name)) return false; seen.add(u.name);
