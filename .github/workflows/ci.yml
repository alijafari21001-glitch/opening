name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  opencell:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: opencell } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: opencell/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node --check bridge/openrung-bridge.js
      - name: No secrets or service-role keys in the repo
        run: |
          ! grep -rInE "service_role|sk_live_|BEGIN (RSA|OPENSSH) PRIVATE KEY" --exclude-dir=.git --exclude-dir=node_modules --exclude=ci.yml --exclude=SECURITY.md --exclude=*.md .
